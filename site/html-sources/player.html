        <section id="playerPage" class="pageView playerPage" hidden>
          <div id="playerDetail" class="playerDetail" data-mfl-static-player-shell="true">
            <section class="playerHero playerHeroPending" aria-hidden="true">
              <div class="playerHeroMedia">
                <div class="playerHeroOverall isPending"><strong>&nbsp;</strong></div>
                <div class="playerHeroPortraitFrame"><canvas class="playerHeroPortrait" aria-hidden="true"></canvas></div>
              </div>
              <div class="playerHeroIdentity">
                <button class="playerEyebrow playerIdText" type="button" disabled>ID #000000</button>
                <h2 class="tablePageTitle playerTitle"><span class="playerTitleName">&nbsp;</span><span class="playerTitleNoteIcon" data-player-note-title-icon></span></h2>
                <p>&nbsp;</p>
              </div>
              <div class="playerHeroActions">
                <div class="playerHeroActionMenu">
                  <a class="playerExternalButton playerHeroPrimaryAction" tabindex="-1" aria-hidden="true" aria-disabled="true">Open link</a>
                  <button class="playerHeroActionMenuButton" type="button" disabled aria-hidden="true" aria-disabled="true"><svg class="playerHeroChevronIcon" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"></path></svg></button>
                  <div class="playerHeroActionMenuDropdown" hidden></div>
                </div>
              </div>
            </section>
            <section class="playerGrid playerGridPending" data-mfl-static-player-grid="true" aria-hidden="true">
              <div class="playerStack">
                <div class="playerPanel playerInfoPanel">
                  <h3>Profile</h3>
                  <div class="detailGrid">
                    <div class="nationalityDetailCard"><span>Nationality</span><strong>&nbsp;</strong></div>
                    <div><span>Age</span><strong data-mfl-static-player-age><span class="playerDetailAgeLine">&nbsp;</span></strong></div>
                    <div><span>Height</span><strong>&nbsp;</strong></div>
                    <div><span>Foot</span><strong>&nbsp;</strong></div>
                    <div><span>Seasons</span><strong>&nbsp;</strong></div>
                    <div><span>Agent</span><strong>&nbsp;</strong></div>
                    <div class="contractDetailCard playerInfoFullWidthCard"><span>Contract</span><strong>&nbsp;</strong></div>
                    <div class="revShareDetailCard playerInfoFullWidthCard"><span>Rev Share</span><strong>&nbsp;</strong></div>
                  </div>
                </div>
                <div class="playerPanel attributesPanel">
                  <div class="playerPanelHeader">
                    <h3>Attributes</h3>
                    <div class="playerAttributeViews">
                      <button class="playerAttributeViewButton active" type="button" data-view="attributes" disabled>Attributes</button>
                      <button class="playerAttributeViewButton" type="button" data-view="training" disabled>Training</button>
                      <button class="playerAttributeViewButton" type="button" data-view="next" disabled>Next Overall</button>
                      <button class="playerAttributeViewButton" type="button" data-view="current" disabled>Current Season</button>
                      <button class="playerAttributeViewButton" type="button" data-view="all" disabled>All Time</button>
                    </div>
                  </div>
                  <div class="attributeGrid" data-mfl-static-player-attributes>
                    <div class="playerAttributeCard featured fullWidth"><span>Overall</span><strong>&nbsp;</strong></div>
                    <div class="playerAttributeCard"><span>&nbsp;</span><strong>&nbsp;</strong></div>
                    <div class="playerAttributeCard"><span>&nbsp;</span><strong>&nbsp;</strong></div>
                    <div class="playerAttributeCard"><span>&nbsp;</span><strong>&nbsp;</strong></div>
                    <div class="playerAttributeCard"><span>&nbsp;</span><strong>&nbsp;</strong></div>
                    <div class="playerAttributeCard"><span>&nbsp;</span><strong>&nbsp;</strong></div>
                    <div class="playerAttributeCard"><span>&nbsp;</span><strong>&nbsp;</strong></div>
                  </div>
                </div>
                <div class="playerPanel playerNotesPanel" data-mfl-static-player-notes="true">
                  <h3>Notes</h3>
                  <div class="playerNotesInputWrap">
                    <textarea class="playerNotesInput" style="visibility:hidden" aria-hidden="true" disabled></textarea>
                    <span class="playerNotesCount" style="visibility:hidden">0/100</span>
                  </div>
                </div>
              </div>
              <div class="playerPanel pitchPanel"><h3>Positions</h3><div class="pitch">
                <span class="pitchLine pitchBoxTop"></span><span class="pitchLine pitchGoalTop"></span><span class="pitchLine pitchArcTop"></span><span class="pitchLine pitchBoxBottom"></span><span class="pitchLine pitchGoalBottom"></span><span class="pitchLine pitchArcBottom"></span>
                <div class="pitchRow pitchRow1" style="--pitch-columns: 1"><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div></div>
                <div class="pitchRow pitchRow3" style="--pitch-columns: 3"><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div></div>
                <div class="pitchRow pitchRow1" style="--pitch-columns: 1"><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div></div>
                <div class="pitchRow pitchRow3" style="--pitch-columns: 3"><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div></div>
                <div class="pitchRow pitchRow3" style="--pitch-columns: 3"><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div></div>
                <div class="pitchRow pitchRow3" style="--pitch-columns: 3"><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div></div>
                <div class="pitchRow pitchRow1" style="--pitch-columns: 1"><div class="pitchPositionSlot" style="cursor:default;user-select:none;-webkit-user-select:none"><span class="pitchPositionBlank" aria-hidden="true"></span></div></div>
              </div></div>
            </section>
          </div>
        </section>
        <script>
          (() => {
            const root = document.documentElement;
            if (root.dataset.initialEntityRoute !== "player") return;
            root.dataset.playerFirstPaintContentReady = "false";
            root.dataset.playerFirstPaintCuesReady = "false";
            const playerPage = document.getElementById("playerPage");
            const playerDetail = document.getElementById("playerDetail");
            const hero = playerDetail?.querySelector(":scope > .playerHero.playerHeroPending");
            const notesPanel = document.querySelector("#playerPage [data-mfl-static-player-notes]");
            const views = document.querySelector("#playerPage .playerAttributeViews");
            const routeMatch = String(window.location.pathname || "").match(/^\/players\/(\d{1,20})\/?$/i);
            const playerId = routeMatch ? String(routeMatch[1] || "") : "";
            const compactPlayerPageName = (value) => {
              const fullName = String(value || "").trim().replace(/\s+/g, " ");
              if (!fullName) return "";
              return fullName.replace(/^(\S)[^\s]*\s+(?:.*\s)?(\S+)$/, "$1. $2");
            };
            const applyFirstPaintHeroActionLayout = (playerHero) => {
              if (!(playerHero instanceof HTMLElement)) return;
              const actions = playerHero.querySelector(":scope > .playerHeroActions");
              const wrapper = actions?.querySelector(":scope > .playerHeroActionMenu");
              const primary = wrapper?.querySelector(":scope > .playerHeroPrimaryAction");
              const toggle = wrapper?.querySelector(":scope > .playerHeroActionMenuButton");
              if (!(actions instanceof HTMLElement) || !(wrapper instanceof HTMLElement)) return;

              actions.style.gap = "0";
              actions.style.alignSelf = "var(--mfl-player-hero-actions-align-self, center)";
              actions.style.marginLeft = "var(--mfl-player-hero-actions-margin-left, auto)";
              const menuWidth = "var(--mfl-player-hero-action-menu-width, 190px)";
              wrapper.style.position = "relative";
              wrapper.style.display = "inline-flex";
              wrapper.style.alignItems = "stretch";
              wrapper.style.gap = "var(--mfl-player-hero-action-gap, 4px)";
              wrapper.style.flex = "0 0 " + menuWidth;
              wrapper.style.width = menuWidth;
              wrapper.style.minWidth = menuWidth;
              wrapper.style.maxWidth = menuWidth;

              if (primary instanceof HTMLElement) {
                const width = "var(--mfl-player-hero-primary-action-width, 152px)";
                const height = "var(--mfl-player-hero-action-height, 40px)";
                primary.style.boxSizing = "border-box";
                primary.style.display = "inline-flex";
                primary.style.alignItems = "center";
                primary.style.justifyContent = "center";
                primary.style.flex = "0 0 " + width;
                primary.style.width = width;
                primary.style.minWidth = width;
                primary.style.maxWidth = width;
                primary.style.height = height;
                primary.style.minHeight = height;
                primary.style.maxHeight = height;
                primary.style.padding = "0 10px";
                primary.style.fontSize = "var(--mfl-player-hero-action-font-size, 16px)";
                primary.style.lineHeight = "1";
                primary.style.whiteSpace = "nowrap";
                primary.style.textDecoration = "none";
                primary.style.color = "var(--text-soft)";
                primary.style.opacity = "0.5";
                primary.style.cursor = "default";
                primary.style.pointerEvents = "none";
              }

              if (toggle instanceof HTMLElement) {
                const width = "var(--mfl-player-hero-action-chevron-width, 34px)";
                const height = "var(--mfl-player-hero-action-height, 40px)";
                toggle.style.boxSizing = "border-box";
                toggle.style.display = "grid";
                toggle.style.placeItems = "center";
                toggle.style.flex = "0 0 " + width;
                toggle.style.width = width;
                toggle.style.minWidth = width;
                toggle.style.maxWidth = width;
                toggle.style.height = height;
                toggle.style.minHeight = height;
                toggle.style.maxHeight = height;
                toggle.style.padding = "0";
                toggle.style.color = "var(--text-soft)";
                toggle.style.opacity = "0.5";
                toggle.style.cursor = "default";
                const icon = toggle.querySelector(".playerHeroChevronIcon");
                if (icon instanceof SVGElement) {
                  const iconSize = "var(--mfl-player-hero-chevron-icon-size, 16px)";
                  icon.style.width = iconSize;
                  icon.style.height = iconSize;
                  icon.style.fill = "none";
                  icon.style.stroke = "currentColor";
                  icon.style.strokeWidth = "2";
                  icon.style.strokeLinecap = "round";
                  icon.style.strokeLinejoin = "round";
                }
              }
            };
            let firstPaintContext = null;
            if (playerId) {
              try {
                const value = JSON.parse(sessionStorage.getItem("mfl-player-first-paint-v1:" + playerId) || "null");
                firstPaintContext = value && typeof value === "object" && !Array.isArray(value) ? value : null;
              } catch {}
            }
            if (playerPage instanceof HTMLElement) playerPage.hidden = false;
            applyFirstPaintHeroActionLayout(hero);
            if (hero instanceof HTMLElement && playerId) {
              hero.dataset.playerShellId = playerId;
              const idButton = hero.querySelector(".playerIdText");
              if (idButton instanceof HTMLElement) idButton.textContent = "ID #" + playerId;
              const knownValues = firstPaintContext?.knownValues && typeof firstPaintContext.knownValues === "object" ? firstPaintContext.knownValues : null;
              const cachedName = String(firstPaintContext?.name || knownValues?.name?.display || knownValues?.name?.raw || "").trim();
              const suppliedPositions = Array.isArray(firstPaintContext?.positions)
                ? firstPaintContext.positions
                : String(firstPaintContext?.positions || "").split(",");
              const cachedPositionText = String(knownValues?.positions?.display ?? knownValues?.positions?.raw ?? "");
              const cachedPositions = (suppliedPositions.some((position) => String(position || "").trim()) ? suppliedPositions : cachedPositionText.split(","))
                .map((position) => String(position || "").trim())
                .filter(Boolean);
              const titleName = hero.querySelector(".playerTitleName");
              if (titleName instanceof HTMLElement && cachedName) {
                const displayName = window.matchMedia("(max-width: 900px)").matches ? compactPlayerPageName(cachedName) : cachedName;
                titleName.dataset.playerFullName = cachedName;
                titleName.textContent = displayName;
                titleName.setAttribute("aria-label", cachedName);
              }
              const positionsText = hero.querySelector(".playerHeroIdentity > p");
              if (positionsText instanceof HTMLElement && cachedPositions.length) positionsText.textContent = cachedPositions.join(", ");
            }
            if (notesPanel instanceof HTMLElement) notesPanel.hidden = root.dataset.storedWalletOptIn !== "true";

            const staticAge = document.querySelector("#playerPage [data-mfl-static-player-age]");
            if (staticAge instanceof HTMLElement && playerId) {
              const context = firstPaintContext;
              const known = context?.knownValues && typeof context.knownValues === "object" ? context.knownValues : null;
              const ageEntry = known?.age;
              const retirementEntry = known?.retirement_years;
              const ageText = String(ageEntry?.display ?? ageEntry?.raw ?? "").trim() || "\u00a0";
              const line = document.createElement("span");
              line.className = "playerDetailAgeLine";
              line.appendChild(document.createTextNode(ageText));
              const retirementYears = retirementEntry?.raw === null || retirementEntry?.raw === undefined || retirementEntry?.raw === ""
                ? Number.NaN
                : Number(retirementEntry.raw);
              if (Number.isFinite(retirementYears) && [0, 1, 2, 3].includes(retirementYears)) {
                const marker = document.createElement("i");
                marker.classList.add("retirementMarker", "playerAgeMarker");
                if (retirementYears === 0) {
                  marker.classList.add("retirementMarker--retired");
                  marker.dataset.tooltip = "Retired";
                  marker.setAttribute("aria-label", "Retired");
                  const image = document.createElement("img");
                  image.src = "/retirement-calendar-x-2.svg";
                  image.width = 16;
                  image.height = 16;
                  image.alt = "";
                  image.setAttribute("aria-hidden", "true");
                  marker.appendChild(image);
                } else {
                  const label = retirementYears + " year" + (retirementYears === 1 ? "" : "s") + " left";
                  marker.classList.add("retirementMarker--retiring-" + retirementYears);
                  marker.dataset.tooltip = label;
                  marker.setAttribute("aria-label", label);
                }
                line.appendChild(marker);
              }
              staticAge.replaceChildren(line);
            }

            const staticAttributes = document.querySelector("#playerPage [data-mfl-static-player-attributes]");
            if (staticAttributes instanceof HTMLElement && playerId) {
              const context = firstPaintContext;
              const known = context?.knownValues && typeof context.knownValues === "object" ? context.knownValues : null;
              const positionEntry = known?.positions;
              const suppliedPositions = Array.isArray(context?.positions)
                ? context.positions
                : String(context?.positions || "").split(",");
              const cachedPositionText = String(positionEntry?.display ?? positionEntry?.raw ?? "");
              const positions = (suppliedPositions.some((position) => String(position || "").trim())
                ? suppliedPositions
                : cachedPositionText.split(","))
                .map((position) => String(position || "").trim().toUpperCase())
                .filter(Boolean);
              const labels = !positions.length
                ? ["Overall", "", "", "", "", "", ""]
                : (positions[0] === "GK"
                  ? ["Overall", "Goalkeeping"]
                  : ["Overall", "Pace", "Dribbling", "Shooting", "Defense", "Passing", "Physical"]);
              const goalkeeper = labels.length === 2;
              staticAttributes.replaceChildren(...labels.map((label, index) => {
                const card = document.createElement("div");
                card.className = "playerAttributeCard"
                  + (index === 0 ? " featured" : "")
                  + (index === 0 || goalkeeper ? " fullWidth" : "");
                const name = document.createElement("span");
                name.textContent = label || "\u00a0";
                const value = document.createElement("strong");
                value.textContent = "\u00a0";
                card.append(name, value);
                return card;
              }));
            }

            if (views instanceof HTMLElement) {
              const progressionAccess = root.dataset.storedProgressionAccess === "true";
              views.querySelectorAll(":scope > .playerAttributeViewButton[data-view]").forEach((button) => {
                if (!(button instanceof HTMLButtonElement)) return;
                const view = String(button.dataset.view || "");
                if (view === "current" || view === "all") button.hidden = !progressionAccess;
              });

              let shell = views.parentElement instanceof HTMLElement && views.parentElement.classList.contains("viewsScrollerShell")
                ? views.parentElement
                : null;
              if (!(shell instanceof HTMLElement)) {
                shell = document.createElement("div");
                shell.className = "viewsScrollerShell";
                views.insertAdjacentElement("beforebegin", shell);
                shell.appendChild(views);
              }

              const renderedItems = Array.from(views.children).filter((child) => {
                if (!(child instanceof HTMLElement) || child.hidden) return false;
                const style = getComputedStyle(child);
                return style.display !== "none" && style.position !== "absolute" && child.getClientRects().length > 0;
              });
              const viewStyle = getComputedStyle(views);
              const gap = Number.parseFloat(viewStyle.columnGap || viewStyle.gap) || 0;
              const contentWidth = renderedItems.reduce((total, item) => {
                const style = getComputedStyle(item);
                return total + item.getBoundingClientRect().width
                  + (Number.parseFloat(style.marginLeft) || 0)
                  + (Number.parseFloat(style.marginRight) || 0);
              }, 0) + gap * Math.max(0, renderedItems.length - 1);
              const overflowing = window.matchMedia("(max-width: 900px)").matches
                && views.getClientRects().length > 0
                && contentWidth - views.clientWidth > 2;
              views.classList.toggle("mflViewsOverflowing", overflowing);
              let arrow = shell.querySelector(":scope > .viewsScrollButton.viewsScrollButtonRight");
              if (overflowing && !(arrow instanceof HTMLButtonElement)) {
                arrow = document.createElement("button");
                arrow.type = "button";
                arrow.className = "viewsScrollButton viewsScrollButtonRight";
                arrow.dataset.mflFirstPaintScrollButton = "true";
                arrow.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>';
                arrow.addEventListener("click", () => {
                  const maxScroll = Math.max(0, views.scrollWidth - views.clientWidth);
                  const distance = Math.max(96, Math.floor(views.clientWidth * 0.72));
                  views.scrollTo({ left: Math.min(maxScroll, views.scrollLeft + distance), behavior: "smooth" });
                });
                shell.appendChild(arrow);
              }
              if (arrow instanceof HTMLButtonElement) {
                arrow.setAttribute("aria-label", "Scroll attribute views right");
                arrow.setAttribute("aria-hidden", overflowing ? "false" : "true");
                arrow.tabIndex = overflowing ? 0 : -1;
                arrow.classList.toggle("mflViewsScrollButtonVisible", overflowing);
                if (!overflowing && arrow.dataset.mflFirstPaintScrollButton === "true") arrow.remove();
              }
            }
            root.dataset.playerFirstPaintCuesReady = "false";
          })();
        </script>
