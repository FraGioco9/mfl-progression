name: Update filter selection validation once

on:
  push:
    branches:
      - arch/754-shared-foundations-fragment

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-foundations-fragment
          fetch-depth: 0
      - name: Use manifest-owned Shared source and audit validator readers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('site/validate-table-filter-selection-lifecycle.mjs')
          source = path.read_text()
          anchor = 'import { coreSourceByDomain } from "./modules/core-source-manifest.js";\n'
          helper = 'import { readCanonicalCoreSource } from "./validate-core-sources.mjs";\n'
          if helper not in source:
            if anchor not in source:
              raise SystemExit('manifest import anchor not found')
            source = source.replace(anchor, anchor + helper, 1)
          old = '  read("./modules/core-sources/shared.js"),'
          new = '  Promise.resolve(readCanonicalCoreSource("shared")),'
          if old not in source:
            raise SystemExit('Shared source read pattern not found')
          path.write_text(source.replace(old, new, 1))

          remaining = []
          for candidate in Path('site').glob('validate*.mjs'):
            text = candidate.read_text()
            if 'read("./modules/core-sources/shared.js")' in text or "read('./modules/core-sources/shared.js')" in text:
              remaining.append(str(candidate))
          if remaining:
            raise SystemExit('Direct Shared validator readers remain: ' + ', '.join(remaining))
          PY
          rm .github/workflows/update-filter-selection-validation-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/validate-table-filter-selection-lifecycle.mjs .github/workflows/update-filter-selection-validation-once.yml
          git commit -m "Use canonical Shared source in filter lifecycle validation"
          git push origin HEAD:arch/754-shared-foundations-fragment
