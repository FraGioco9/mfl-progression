name: Run Shared watchlist actions split once

on:
  push:
    branches:
      - arch/754-shared-watchlist-actions

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Split Shared watchlist actions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shared_path = Path("site/modules/core-sources/shared.js")
          fragment_path = Path("site/modules/core-sources/shared-watchlist-actions.js")
          manifest_path = Path("site/modules/core-source-manifest.js")

          source = shared_path.read_text(encoding="utf-8")
          marker = "function countryCodeForNationality(nationality) {"
          if source.count(marker) != 1:
              raise SystemExit(f"Expected exactly one split marker, found {source.count(marker)}")
          split_at = source.index(marker)
          fragment = source[:split_at].rstrip()
          remainder = source[split_at:]

          if not fragment.startswith("function removePlayerIdFromAllWatchlists(playerId) {"):
              raise SystemExit("Watchlist actions fragment does not start at canonical mutation boundary")
          if not fragment.endswith("renderPlayerPage(key);\n  }\n}"):
              raise SystemExit("Watchlist actions fragment does not end at canonical toggleWatchlistPlayer boundary")
          if not remainder.startswith(marker):
              raise SystemExit("Remaining Shared fragment does not start at nationality display boundary")
          if fragment + "\n\n" + remainder.rstrip() != source.rstrip():
              raise SystemExit("Split would change assembled Shared source bytes")

          fragment_path.write_text(fragment + "\n", encoding="utf-8")
          shared_path.write_text(remainder, encoding="utf-8")

          manifest = manifest_path.read_text(encoding="utf-8")
          old = '"shared-player-first-paint.js", "shared.js"'
          new = '"shared-player-first-paint.js", "shared-watchlist-actions.js", "shared.js"'
          if manifest.count(old) != 1:
              raise SystemExit(f"Expected one manifest insertion point, found {manifest.count(old)}")
          manifest_path.write_text(manifest.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit split and remove one-time migration
        shell: bash
        run: |
          rm .github/workflows/run-shared-watchlist-actions-split-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/core-source-manifest.js site/modules/core-sources/shared-watchlist-actions.js site/modules/core-sources/shared.js .github/workflows/run-shared-watchlist-actions-split-once.yml
          git commit -m "Split Shared watchlist actions fragment"
          git push origin HEAD:arch/754-shared-watchlist-actions
