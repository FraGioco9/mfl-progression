name: Run lifecycle validator migration once
on:
  push:
    branches: [arch/754-shared-page-lifecycle-fragment]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-page-lifecycle-fragment
      - run: node site/.tmp-align-page-lifecycle-validation.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm site/.tmp-align-page-lifecycle-validation.mjs .github/workflows/run-page-lifecycle-validator-migration-once.yml
          git add site/validate.mjs site/validate-club-route-core.mjs site/validate-core-source-ownership.mjs site/validate-home-summary-first-paint.mjs site/validate-eval-ownership.mjs site/validate-header-selection-loading.mjs
          git commit -m "Align validators with Shared page lifecycle fragment"
          git push origin HEAD:arch/754-shared-page-lifecycle-fragment
