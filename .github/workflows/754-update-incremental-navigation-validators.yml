name: Issue 754 incremental navigation validator update

on:
  push:
    branches:
      - refactor/754-incremental-navigation-ownership

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/754-incremental-navigation-ownership
          fetch-depth: 0
      - name: Update validator contracts
        run: python .github/scripts/754-update-incremental-navigation-validators.py
      - name: Verify validator syntax
        run: |
          for file in \
            site/validate-loading-ownership.mjs \
            site/validate-database-stats-lazy-runtime.mjs \
            site/validate-club-route-core.mjs \
            site/validate-table-route-core.mjs \
            site/validate-table-sort-session.mjs \
            site/validate-generated-view-transition.mjs \
            site/validate-table-loading-state.mjs \
            site/validate-page-route-gate-transition.mjs \
            site/validate-club-title-loading.mjs; do
            node --check "$file"
          done
      - name: Commit validator updates
        run: |
          rm .github/scripts/754-update-incremental-navigation-validators.py
          rm .github/workflows/754-update-incremental-navigation-validators.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Update incremental navigation validator contracts"
          git push origin HEAD:refactor/754-incremental-navigation-ownership
