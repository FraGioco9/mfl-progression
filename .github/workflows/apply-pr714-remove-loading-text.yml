name: Apply PR714 remove loading text

on:
  push:
    branches:
      - feat/205-my-clubs-data

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/205-my-clubs-data
          fetch-depth: 0
      - name: Remove visible loading text
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('site/html-sources/my-clubs.html')
          text = html.read_text()
          old = '<p id="myClubsStatus" class="myClubsStatus">Loading...</p>'
          new = '<p id="myClubsStatus" class="myClubsStatus" hidden></p>'
          if old not in text:
              raise SystemExit('Expected static Loading... status not found')
          html.write_text(text.replace(old, new, 1))

          js = Path('site/modules/core-sources/my-clubs.js')
          text = js.read_text()
          old = '    const hasLoadingCards = renderLoadingCards(storedClubCount(wallet));\n    setStatus(hasLoadingCards ? "" : "Loading...");'
          new = '    renderLoadingCards(storedClubCount(wallet));\n    setStatus("");'
          if old not in text:
              raise SystemExit('Expected runtime Loading... status not found')
          js.write_text(text.replace(old, new, 1))
          PY
      - name: Validate removal
        run: |
          if grep -R "Loading\.\.\." site/html-sources/my-clubs.html site/modules/core-sources/my-clubs.js; then
            echo 'My Clubs still contains visible Loading... text'
            exit 1
          fi
      - name: Commit changes and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pr714-remove-loading-text.yml
          git add site/html-sources/my-clubs.html site/modules/core-sources/my-clubs.js
          git commit -m "Hide My Clubs loading text"
          git push origin HEAD:feat/205-my-clubs-data
