name: Issue 866 competition migration

on:
  push:
    branches:
      - fix/866-historical-competition-generations

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/866-historical-competition-generations
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python .github/issue-866-migration.py
      - name: Check syntax
        run: python -m py_compile scripts/database/competitions.py tests/test_competition_data.py
      - name: Run competition tests
        run: |
          python -m unittest \
            tests.test_competition_data \
            tests.test_competition_refresh_split
      - name: Commit permanent changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/database/competitions.py tests/test_competition_data.py
          git rm .github/issue-866-migration.py
          git commit -m 'Fix historical competition generation selection'
          git push
