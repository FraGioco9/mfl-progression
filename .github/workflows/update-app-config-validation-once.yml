name: Update App Config validation once

on:
  push:
    branches:
      - arch/754-shared-foundations-fragment

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-foundations-fragment
          fetch-depth: 0
      - name: Use canonical combined core source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('site/validate-app-config.mjs')
          source = path.read_text()
          import_anchor = 'import { readValidationText } from "./validation-text.mjs";\n'
          import_line = 'import { readCombinedCanonicalCoreSource } from "./validate-core-sources.mjs";\n'
          if import_line not in source:
            if import_anchor not in source:
              raise SystemExit('validation text import anchor not found')
            source = source.replace(import_anchor, import_anchor + import_line, 1)
          old = '''  Promise.all([\n    read("./modules/core-sources/shared.js"),\n    read("./modules/core-sources/evaluation.js"),\n    read("./modules/core-sources/mfl-stats.js"),\n    read("./modules/core-sources/club.js"),\n    read("./modules/core-sources/settings.js"),\n    read("./modules/core-sources/player.js"),\n    read("./modules/core-sources/table.js"),\n    read("./modules/core-sources/wallet.js"),\n    read("./modules/core-sources/watchlist.js"),\n  ]).then((parts) => parts.join("\\n")),'''
          new = '  Promise.resolve(readCombinedCanonicalCoreSource()),'
          if old not in source:
            raise SystemExit('app core source assembly pattern not found')
          path.write_text(source.replace(old, new, 1))
          PY
          rm .github/workflows/update-app-config-validation-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/validate-app-config.mjs .github/workflows/update-app-config-validation-once.yml
          git commit -m "Use canonical core source in app config validation"
          git push origin HEAD:arch/754-shared-foundations-fragment
