name: Update Shared validation once

on:
  push:
    branches:
      - arch/754-shared-foundations-fragment

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-foundations-fragment
          fetch-depth: 0
      - name: Update fragment-aware validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('site/validate.mjs')
          source = path.read_text()
          old_manifest = '''invariant(
            sharedCoreManifest?.source === "shared.js"
              && sharedCoreManifest?.runtime === "app-core-runtime.js",
            "Canonical manifest must map the shared core source to app-core-runtime.js.",
          );'''
          new_manifest = '''invariant(
            sharedCoreManifest?.source === "shared-foundations.js"
              && sharedCoreManifest?.sources?.length === 2
              && sharedCoreManifest.sources[0] === "shared-foundations.js"
              && sharedCoreManifest.sources[1] === "shared.js"
              && sharedCoreManifest?.runtime === "app-core-runtime.js",
            "Canonical manifest must map the ordered shared core fragments to app-core-runtime.js.",
          );'''
          if old_manifest not in source:
            raise SystemExit('shared manifest validation pattern not found')
          source = source.replace(old_manifest, new_manifest, 1)

          old_shared = 'const canonicalSharedCore = (await readSite("modules/core-sources/shared.js")).replace(/\\s*$/, "");'
          new_shared = '''const canonicalSharedCore = (await Promise.all(
            sharedCoreManifest.sources.map((sourceName) => readSite(`modules/core-sources/${sourceName}`)),
          )).map((part) => part.replace(/\\s*$/, "")).join("\\n\\n");'''
          if old_shared not in source:
            raise SystemExit('canonical shared source pattern not found')
          source = source.replace(old_shared, new_shared, 1)
          path.write_text(source)

          ownership = Path('docs/ownership.md')
          text = ownership.read_text()
          old = '- `site/modules/core-sources/shared.js` owns universal state, navigation and synchronous cross-route entry points.'
          new = '- `site/modules/core-sources/shared-foundations.js` owns universal state, table/view configuration, constants, and DOM bindings; `site/modules/core-sources/shared.js` owns universal navigation, behavior, and synchronous cross-route entry points.'
          if old in text:
            ownership.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/update-shared-validation-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/validate.mjs docs/ownership.md .github/workflows/update-shared-validation-once.yml
          git commit -m "Make Shared validation fragment-aware"
          git push origin HEAD:arch/754-shared-foundations-fragment
