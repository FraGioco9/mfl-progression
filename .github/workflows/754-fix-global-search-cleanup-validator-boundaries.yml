name: Issue 754 validator boundary cleanup

on:
  push:
    branches:
      - refactor/754-canonical-global-search-clubs

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/754-canonical-global-search-clubs
          fetch-depth: 0

      - name: Update stale validator boundaries
        run: python .github/scripts/754-fix-global-search-cleanup-validator-boundaries.py

      - name: Verify validator syntax
        run: |
          node --check site/validate-table-loading-state.mjs
          node --check site/validate-table-sort-session.mjs
          git diff --check

      - name: Commit validator boundary cleanup
        run: |
          set -euo pipefail
          rm .github/scripts/754-fix-global-search-cleanup-validator-boundaries.py
          rm .github/workflows/754-fix-global-search-cleanup-validator-boundaries.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update validator boundaries after Global Search cleanup"
          git push origin HEAD:refactor/754-canonical-global-search-clubs
