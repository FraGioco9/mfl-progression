name: Update Shared session validations once

on:
  push:
    branches:
      - arch/754-shared-session-fragment

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-session-fragment
          fetch-depth: 0
      - name: Update fragment-aware validation ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
            file = Path(path)
            source = file.read_text()
            if old not in source:
              raise SystemExit(f'Anchor not found in {path}: {old!r}')
            file.write_text(source.replace(old, new, 1))

          replace_once(
            'site/validate.mjs',
            'sharedCoreManifest?.sources?.length === 2\n    && sharedCoreManifest.sources[0] === "shared-foundations.js"\n    && sharedCoreManifest.sources[1] === "shared.js"',
            'sharedCoreManifest?.sources?.length === 3\n    && sharedCoreManifest.sources[0] === "shared-foundations.js"\n    && sharedCoreManifest.sources[1] === "shared-session.js"\n    && sharedCoreManifest.sources[2] === "shared.js"',
          )

          replace_once(
            'site/validate-club-route-core.mjs',
            'coreSourceByDomain.shared?.sources?.length === 2\n    && coreSourceByDomain.shared.sources[1] === "shared.js"',
            'coreSourceByDomain.shared?.sources?.length === 3\n    && coreSourceByDomain.shared.sources[1] === "shared-session.js"\n    && coreSourceByDomain.shared.sources[2] === "shared.js"',
          )

          for path in [
            'site/validate-static-route-ui.mjs',
            'site/validate-player-table-actions.mjs',
          ]:
            file = Path(path)
            source = file.read_text()
            import_anchor = 'import { readValidationText } from "./validation-text.mjs";\n'
            helper_import = 'import { readCanonicalCoreSource } from "./validate-core-sources.mjs";\n'
            if helper_import not in source:
              if import_anchor not in source:
                raise SystemExit(f'Import anchor not found in {path}')
              source = source.replace(import_anchor, import_anchor + helper_import, 1)
            old = '    read("./modules/core-sources/shared.js"),'
            new = '    Promise.resolve(readCanonicalCoreSource("shared")),'
            if old not in source:
              raise SystemExit(f'Shared source read anchor not found in {path}')
            file.write_text(source.replace(old, new, 1))
          PY
          rm .github/workflows/update-shared-session-validations-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/validate.mjs site/validate-club-route-core.mjs site/validate-static-route-ui.mjs site/validate-player-table-actions.mjs .github/workflows/update-shared-session-validations-once.yml
          git commit -m "Use assembled Shared source in session validators"
          git push origin HEAD:arch/754-shared-session-fragment
