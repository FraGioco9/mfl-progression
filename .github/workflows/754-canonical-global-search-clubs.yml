name: Issue 754 canonical Global Search clubs

on:
  push:
    branches:
      - refactor/754-canonical-global-search-clubs

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/754-canonical-global-search-clubs
          fetch-depth: 0

      - name: Apply canonical Global Search Club integration
        run: python .github/scripts/754-canonicalize-global-search-clubs.py

      - name: Verify source syntax and diff
        run: |
          node --check site/modules/core-sources/shared-global-search.js
          node --check site/modules/core-sources/shared.js
          node --check site/validate-core-source-ownership.mjs
          node --check site/validate-global-search-open-lifecycle.mjs
          node --check site/validate-global-search-results.mjs
          node --check site/validate-club-route-core.mjs
          git diff --check

      - name: Commit canonical cleanup
        run: |
          set -euo pipefail
          rm .github/scripts/754-canonicalize-global-search-clubs.py
          rm .github/workflows/754-canonical-global-search-clubs.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canonicalize Global Search Club ownership"
          git push origin HEAD:refactor/754-canonical-global-search-clubs
