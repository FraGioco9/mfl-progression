name: Remove dead Shared data helpers

on:
  push:
    branches:
      - arch/754-dead-shared-data-helpers

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-dead-shared-data-helpers
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 .github/754-dead-data-cleanup.py
      - name: Verify cleanup
        run: node --check site/modules/core-sources/shared.js
      - name: Commit cleanup
        run: |
          rm .github/754-dead-data-cleanup.py
          rm .github/workflows/754-remove-dead-data-helpers.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site .github/754-dead-data-cleanup.py .github/workflows/754-remove-dead-data-helpers.yml
          git commit -m "Remove dead Shared data helpers"
          git push origin HEAD:arch/754-dead-shared-data-helpers
