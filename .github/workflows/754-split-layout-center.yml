name: Issue 754 Shared layout-center split

on:
  push:
    branches:
      - arch/754-shared-layout-center

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-layout-center
          fetch-depth: 0

      - name: Extract layout-center source
        run: python .github/scripts/754-split-layout-center.py

      - name: Verify source syntax and diff
        run: |
          node --check site/modules/core-sources/shared-layout-center.js
          node --check site/modules/core-sources/shared.js
          node --check site/modules/core-source-manifest.js
          node --check site/validate.mjs
          node --check site/validate-club-route-core.mjs
          node --check site/validate-core-source-ownership.mjs
          git diff --check

      - name: Commit layout-center split
        run: |
          set -euo pipefail
          rm .github/scripts/754-split-layout-center.py
          rm .github/workflows/754-split-layout-center.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Extract Shared layout centering"
          git push origin HEAD:arch/754-shared-layout-center
