name: Split Shared page lifecycle once

on:
  push:
    branches:
      - arch/754-shared-page-lifecycle-fragment

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-page-lifecycle-fragment
          fetch-depth: 0
      - name: Split canonical Shared page lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shared_path = Path("site/modules/core-sources/shared.js")
          lifecycle_path = Path("site/modules/core-sources/shared-page-lifecycle.js")
          manifest_path = Path("site/modules/core-source-manifest.js")

          original = shared_path.read_text(encoding="utf-8")
          anchor = "\n\nfunction updateStatusDate(generatedAt) {"
          if anchor not in original:
              raise SystemExit("Shared page-lifecycle boundary not found")

          lifecycle_source, remainder = original.split(anchor, 1)
          lifecycle_source = lifecycle_source.rstrip() + "\n"
          remainder_source = ("function updateStatusDate(generatedAt) {" + remainder).rstrip() + "\n"

          reconstructed = lifecycle_source.rstrip() + "\n\n" + remainder_source.rstrip()
          if reconstructed != original.rstrip():
              raise SystemExit("Shared page-lifecycle split did not reconstruct original canonical bytes")

          lifecycle_path.write_text(lifecycle_source, encoding="utf-8")
          shared_path.write_text(remainder_source, encoding="utf-8")

          manifest = manifest_path.read_text(encoding="utf-8")
          old = '["shared-foundations.js", "shared-session.js", "shared-routing.js", "shared-transitions.js", "shared.js"]'
          new = '["shared-foundations.js", "shared-session.js", "shared-routing.js", "shared-transitions.js", "shared-page-lifecycle.js", "shared.js"]'
          if old not in manifest:
              raise SystemExit("Shared manifest boundary not found")
          manifest_path.write_text(manifest.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit canonical split and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/split-shared-page-lifecycle-once.yml
          git add site/modules/core-source-manifest.js site/modules/core-sources/shared-page-lifecycle.js site/modules/core-sources/shared.js
          git commit -m "Split Shared page lifecycle fragment"
          git push origin HEAD:arch/754-shared-page-lifecycle-fragment
