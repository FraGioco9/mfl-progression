name: Issue 754 final navigation validator fixes

on:
  push:
    branches:
      - refactor/754-incremental-navigation-ownership

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/754-incremental-navigation-ownership
          fetch-depth: 0
      - name: Fix final validator ownership inputs
        run: python .github/scripts/754-fix-final-navigation-validators.py
      - name: Verify validator syntax
        run: |
          node --check site/validate-static-route-ui.mjs
          node --check site/validate-database-stats-lazy-runtime.mjs
          node --check site/validate-pager-cached-route-restore.mjs
      - name: Commit validator fixes
        run: |
          rm .github/scripts/754-fix-final-navigation-validators.py
          rm .github/workflows/754-fix-final-navigation-validators.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix final incremental navigation validators"
          git push origin HEAD:refactor/754-incremental-navigation-ownership
