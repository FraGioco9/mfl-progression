name: Run Shared Evaluation lifecycle split once

on:
  push:
    branches:
      - arch/754-shared-evaluation-lifecycle

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Split Shared Evaluation lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shared_path = Path("site/modules/core-sources/shared.js")
          evaluation_path = Path("site/modules/core-sources/shared-evaluation-lifecycle.js")
          manifest_path = Path("site/modules/core-source-manifest.js")

          source = shared_path.read_text(encoding="utf-8")
          marker = "function playerFirstPaintKnownValues(row) {"
          if source.count(marker) != 1:
              raise SystemExit(f"Expected exactly one split marker, found {source.count(marker)}")

          split_at = source.index(marker)
          evaluation = source[:split_at].rstrip()
          remainder = source[split_at:]

          expected_start = "const DEFAULT_EVALUATION_MFL_PER_USD = 400;"
          expected_end = "return __mflEvaluationRenderPageOwner();\n}"
          if not evaluation.startswith(expected_start):
              raise SystemExit("Evaluation fragment does not start at the canonical Evaluation boundary")
          if not evaluation.endswith(expected_end):
              raise SystemExit("Evaluation fragment does not end at the canonical renderEvaluationPage facade")
          if not remainder.startswith(marker):
              raise SystemExit("Remaining Shared fragment does not start at Player first-paint ownership")

          reconstructed = evaluation + "\n\n" + remainder.rstrip()
          if reconstructed != source.rstrip():
              raise SystemExit("Split would change assembled Shared source bytes")

          evaluation_path.write_text(evaluation + "\n", encoding="utf-8")
          shared_path.write_text(remainder, encoding="utf-8")

          manifest = manifest_path.read_text(encoding="utf-8")
          old = '"shared-data-search.js", "shared.js"'
          new = '"shared-data-search.js", "shared-evaluation-lifecycle.js", "shared.js"'
          if manifest.count(old) != 1:
              raise SystemExit(f"Expected one Shared manifest insertion point, found {manifest.count(old)}")
          manifest_path.write_text(manifest.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit split and remove one-time migration
        shell: bash
        run: |
          rm .github/workflows/run-shared-evaluation-lifecycle-split-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/core-source-manifest.js site/modules/core-sources/shared-evaluation-lifecycle.js site/modules/core-sources/shared.js .github/workflows/run-shared-evaluation-lifecycle-split-once.yml
          git commit -m "Split Shared Evaluation lifecycle fragment"
          git push origin HEAD:arch/754-shared-evaluation-lifecycle
