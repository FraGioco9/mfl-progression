name: Update bootstrap transition validation once

on:
  push:
    branches:
      - arch/754-shared-transitions-fragment

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-transitions-fragment
          fetch-depth: 0
      - name: Use combined canonical core in bootstrap ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('site/validate-bootstrap-ownership.mjs')
          text = path.read_text()
          old_import = 'import { readValidationText } from "./validation-text.mjs";\n'
          new_import = 'import { readValidationText } from "./validation-text.mjs";\nimport { readCombinedCanonicalCoreSource } from "./validate-core-sources.mjs";\n'
          if text.count(old_import) != 1:
              raise SystemExit('Bootstrap ownership import anchor changed')
          text = text.replace(old_import, new_import, 1)
          old_sources = '''  Promise.all([\n    read("./modules/core-sources/shared.js"),\n    read("./modules/core-sources/evaluation.js"),\n    read("./modules/core-sources/mfl-stats.js"),\n    read("./modules/core-sources/club.js"),\n    read("./modules/core-sources/settings.js"),\n    read("./modules/core-sources/player.js"),\n    read("./modules/core-sources/table.js"),\n    read("./modules/core-sources/wallet.js"),\n    read("./modules/core-sources/watchlist.js"),\n  ]).then((parts) => parts.join("\\n")),\n'''
          new_sources = '  Promise.resolve(readCombinedCanonicalCoreSource()),\n'
          if text.count(old_sources) != 1:
              raise SystemExit('Bootstrap ownership physical core list anchor changed')
          path.write_text(text.replace(old_sources, new_sources, 1))
          PY
          rm .github/workflows/update-bootstrap-transition-validation-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/validate-bootstrap-ownership.mjs .github/workflows/update-bootstrap-transition-validation-once.yml
          git commit -m "Make bootstrap transition validation fragment-aware"
          git push origin HEAD:arch/754-shared-transitions-fragment
