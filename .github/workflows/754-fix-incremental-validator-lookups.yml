name: Fix incremental validator ownership

on:
  push:
    branches:
      - arch/754-shared-incremental-routing

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-incremental-routing
          fetch-depth: 0
      - name: Apply validator ownership fix
        run: python .github/scripts/754-fix-incremental-validator-lookups.py
      - name: Verify validators parse
        run: |
          node --check site/validate-table-loading-state.mjs
          node --check site/validate-pager-current-page.mjs
          node --check site/validate-data-client-runtime-ownership.mjs
      - name: Commit validator ownership fix
        run: |
          rm .github/scripts/754-fix-incremental-validator-lookups.py
          rm .github/workflows/754-fix-incremental-validator-lookups.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site .github/scripts/754-fix-incremental-validator-lookups.py .github/workflows/754-fix-incremental-validator-lookups.yml
          git commit -m "Fix incremental validator ownership"
          git push origin HEAD:arch/754-shared-incremental-routing
