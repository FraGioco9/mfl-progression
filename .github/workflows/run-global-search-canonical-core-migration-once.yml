name: Run Global Search canonical-core migration once

on:
  push:
    branches:
      - arch/754-shared-personal-state-fragment

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-personal-state-fragment
      - name: Align Global Search validator with canonical core
        run: node .github/align-global-search-canonical-core.mjs
      - name: Commit validator migration and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/align-global-search-canonical-core.mjs .github/workflows/run-global-search-canonical-core-migration-once.yml
          git add site/validate-global-search-results.mjs
          git commit -m "Read assembled canonical core in Global Search validation"
          git push origin HEAD:arch/754-shared-personal-state-fragment
