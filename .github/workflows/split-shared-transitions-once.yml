name: Split Shared transitions once

on:
  push:
    branches:
      - arch/754-shared-transitions-fragment

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-transitions-fragment
          fetch-depth: 0
      - name: Split Shared transition owner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shared_path = Path('site/modules/core-sources/shared.js')
          transitions_path = Path('site/modules/core-sources/shared-transitions.js')
          manifest_path = Path('site/modules/core-source-manifest.js')

          source = shared_path.read_text().replace('\r\n', '\n').replace('\r', '\n')
          marker = 'function resetPageScroll() {'
          if source.count(marker) != 1:
              raise SystemExit(f'Expected one Shared page-lifecycle boundary, found {source.count(marker)}')

          boundary = source.index(marker)
          transitions = source[:boundary].rstrip()
          lifecycle = source[boundary:].rstrip()
          if not transitions or not lifecycle:
              raise SystemExit('Shared transition split produced an empty fragment')

          reconstructed = f'{transitions}\n\n{lifecycle}'
          if reconstructed != source.rstrip():
              raise SystemExit('Shared transition split does not reconstruct the previous canonical source exactly')

          if not transitions.startswith('function currentNavigationPath() {'):
              raise SystemExit('Shared transition fragment must begin at currentNavigationPath')
          if not transitions.endswith('Reflect.set(window, "__mflWaitForViewTransitionPaint", waitForViewTransitionPaint);'):
              raise SystemExit('Shared transition fragment must end after publishing the transition facade')
          if not lifecycle.startswith('function resetPageScroll() {'):
              raise SystemExit('Remaining Shared lifecycle must begin at resetPageScroll')

          transitions_path.write_text(transitions + '\n')
          shared_path.write_text(lifecycle + '\n')

          manifest = manifest_path.read_text()
          old = '["shared", ["shared-foundations.js", "shared-session.js", "shared-routing.js", "shared.js"], "app-core-runtime.js"'
          new = '["shared", ["shared-foundations.js", "shared-session.js", "shared-routing.js", "shared-transitions.js", "shared.js"], "app-core-runtime.js"'
          if old not in manifest:
              raise SystemExit('Shared manifest fragment list anchor not found')
          manifest_path.write_text(manifest.replace(old, new, 1))
          PY
          rm .github/workflows/split-shared-transitions-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/modules/core-sources/shared-transitions.js site/modules/core-sources/shared.js site/modules/core-source-manifest.js .github/workflows/split-shared-transitions-once.yml
          git commit -m "Split Shared transitions from page lifecycle"
          git push origin HEAD:arch/754-shared-transitions-fragment
