name: Run Shared Evaluation validator migration once

on:
  push:
    branches:
      - arch/754-shared-evaluation-lifecycle

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Align Shared Evaluation ownership validators
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          validate = Path("site/validate.mjs")
          replace_once(validate, "sharedCoreManifest?.sources?.length === 11", "sharedCoreManifest?.sources?.length === 12")
          replace_once(
              validate,
              '    && sharedCoreManifest.sources[9] === "shared-data-search.js"\n    && sharedCoreManifest.sources[10] === "shared.js"',
              '    && sharedCoreManifest.sources[9] === "shared-data-search.js"\n    && sharedCoreManifest.sources[10] === "shared-evaluation-lifecycle.js"\n    && sharedCoreManifest.sources[11] === "shared.js"',
          )

          club = Path("site/validate-club-route-core.mjs")
          replace_once(club, "coreSourceByDomain.shared?.sources?.length === 11", "coreSourceByDomain.shared?.sources?.length === 12")
          replace_once(
              club,
              '    && coreSourceByDomain.shared.sources[9] === "shared-data-search.js"\n    && coreSourceByDomain.shared.sources[10] === "shared.js"',
              '    && coreSourceByDomain.shared.sources[9] === "shared-data-search.js"\n    && coreSourceByDomain.shared.sources[10] === "shared-evaluation-lifecycle.js"\n    && coreSourceByDomain.shared.sources[11] === "shared.js"',
          )

          ownership = Path("site/validate-core-source-ownership.mjs")
          replace_once(ownership, "sharedEntry?.sources?.length === 11", "sharedEntry?.sources?.length === 12")
          replace_once(
              ownership,
              '    && sharedEntry.sources[9] === "shared-data-search.js"\n    && sharedEntry.sources[10] === "shared.js"',
              '    && sharedEntry.sources[9] === "shared-data-search.js"\n    && sharedEntry.sources[10] === "shared-evaluation-lifecycle.js"\n    && sharedEntry.sources[11] === "shared.js"',
          )
          replace_once(
              ownership,
              '  "Shared core must keep foundations before session before routing before transitions before page lifecycle before Home summary before table state before generic toast core before personal state before data/search before remaining shared behavior and retain the explicit 355000-byte universal no-growth ceiling.",',
              '  "Shared core must keep foundations before session before routing before transitions before page lifecycle before Home summary before table state before generic toast core before personal state before data/search before Evaluation lifecycle before remaining shared behavior and retain the explicit 355000-byte universal no-growth ceiling.",',
          )
          replace_once(
              ownership,
              'const sharedDataSearch = await read("./modules/core-sources/shared-data-search.js");\nconst sharedNavigation = await read("./modules/core-sources/shared.js");',
              'const sharedDataSearch = await read("./modules/core-sources/shared-data-search.js");\nconst sharedEvaluationLifecycle = await read("./modules/core-sources/shared-evaluation-lifecycle.js");\nconst sharedNavigation = await read("./modules/core-sources/shared.js");',
          )
          replace_once(
              ownership,
              'invariant(\n  sharedNavigation.startsWith("const DEFAULT_EVALUATION_MFL_PER_USD = 400;"),\n  "Remaining Shared behavior must begin at the eager Evaluation lifecycle boundary.",\n);',
              'invariant(\n  sharedEvaluationLifecycle.startsWith("const DEFAULT_EVALUATION_MFL_PER_USD = 400;")\n    && sharedEvaluationLifecycle.replace(/\\s*$/, "").endsWith("return __mflEvaluationRenderPageOwner();\\n}"),\n  "Shared Evaluation lifecycle must own eager Evaluation settings/search/readiness through the canonical renderEvaluationPage facade.",\n);\ninvariant(\n  sharedNavigation.startsWith("function playerFirstPaintKnownValues(row) {"),\n  "Remaining Shared behavior must begin at the Player first-paint/navigation boundary.",\n);',
          )
          replace_once(
              ownership,
              '    && !sharedPersonalState.includes("function formatCount")\n    && !sharedDataSearch.includes("const DEFAULT_EVALUATION_MFL_PER_USD"),\n  "Shared foundations, session, routing, transitions, page lifecycle, Home summary, table state, generic toast core, personal state, and data/search must not absorb later ownership domains.",',
              '    && !sharedPersonalState.includes("function formatCount")\n    && !sharedDataSearch.includes("const DEFAULT_EVALUATION_MFL_PER_USD")\n    && !sharedEvaluationLifecycle.includes("function playerFirstPaintKnownValues"),\n  "Shared foundations, session, routing, transitions, page lifecycle, Home summary, table state, generic toast core, personal state, data/search, and Evaluation lifecycle must not absorb later ownership domains.",',
          )

          lifecycle = Path("site/validate-evaluation-search-lifecycle.mjs")
          text = lifecycle.read_text(encoding="utf-8")
          text = text.replace(
              'import { readCanonicalCoreArtifacts } from "./validate-core-sources.mjs";',
              'import { readCanonicalCoreArtifacts, readCombinedCanonicalCoreSource } from "./validate-core-sources.mjs";',
              1,
          )
          pattern = re.compile(
              r'const \[searchRuntime, layoutRuntime, appEntry, walletPreferences, loadingStyles, appCoreSource\] = await Promise\.all\(\[.*?\n\]\);\nconst artifacts = readCanonicalCoreArtifacts\(appCoreSource\);',
              re.S,
          )
          replacement = '''const [searchRuntime, layoutRuntime, appEntry, walletPreferences, loadingStyles] = await Promise.all([\n  read("./evaluation-search-state-runtime.js"),\n  read("./evaluation-layout-runtime.js"),\n  read("./modules/app-entry.js"),\n  read("./api/wallet-preferences.js"),\n  read("./loading.css"),\n]);\nconst appCoreSource = readCombinedCanonicalCoreSource();\nconst artifacts = readCanonicalCoreArtifacts();'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"{lifecycle}: expected one canonical-core reader migration, found {count}")
          lifecycle.write_text(text, encoding="utf-8")

          docs = Path("docs/ownership.md")
          text = docs.read_text(encoding="utf-8")
          old = '`site/modules/core-sources/shared-data-search.js` owns generic row/value/date/contract/listing formatting, player/agent route and search-entry construction, and the canonical database/global-search index/request pipeline from `formatCount()` through `ensureSearchIndexes()`; `site/modules/core-sources/shared.js` now begins at `DEFAULT_EVALUATION_MFL_PER_USD` and owns the remaining eager Evaluation lifecycle and later shared behavior.'
          new = '`site/modules/core-sources/shared-data-search.js` owns generic row/value/date/contract/listing formatting, player/agent route and search-entry construction, and the canonical database/global-search index/request pipeline from `formatCount()` through `ensureSearchIndexes()`; `site/modules/core-sources/shared-evaluation-lifecycle.js` owns eager Evaluation settings, search-selection, readiness, and render facades from `DEFAULT_EVALUATION_MFL_PER_USD` through `renderEvaluationPage()`; `site/modules/core-sources/shared.js` now begins at `playerFirstPaintKnownValues()` and owns the remaining Player/navigation and later shared behavior.'
          if text.count(old) != 1:
              raise SystemExit("docs/ownership.md: Evaluation ownership sentence not found exactly once")
          text = text.replace(old, new, 1)
          text = text.replace(
              'personal state remains separate from generic data/search, and generic data/search remains separate from Evaluation so bootstrap data loading, navigation/session state, feature feedback, persistence, shared row/search modeling, and Evaluation lifecycle keep explicit ownership boundaries.',
              'personal state remains separate from generic data/search, generic data/search remains separate from the eager Evaluation lifecycle, and Evaluation lifecycle remains separate from Player/navigation behavior so bootstrap data loading, navigation/session state, feature feedback, persistence, shared row/search modeling, Evaluation readiness, and Player first-paint ownership keep explicit boundaries.',
              1,
          )
          text = text.replace(
              'Keeping source order byte-identical also makes the eager Evaluation lifecycle the next dependency-closed Shared prefix; later decompositions should preserve that ordering rather than moving middle blocks merely to create files.',
              'The eager Evaluation lifecycle is isolated without reordering source, preserving byte-identical execution while exposing Player first-paint/navigation as the next remaining Shared boundary.',
              1,
          )
          text = text.replace(
              'generic row/value/search/index assertions must not read final `shared.js` directly for behavior owned by `shared-data-search.js`.',
              'generic row/value/search/index assertions must not read final `shared.js` directly for behavior owned by `shared-data-search.js`; Evaluation settings/search/readiness assertions must not read final `shared.js` directly for behavior owned by `shared-evaluation-lifecycle.js`.',
              1,
          )
          docs.write_text(text, encoding="utf-8")
          PY
      - name: Commit validator migration and remove one-time files
        shell: bash
        run: |
          rm .github/workflows/run-shared-evaluation-validator-migration-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ownership.md site/validate.mjs site/validate-club-route-core.mjs site/validate-core-source-ownership.mjs site/validate-evaluation-search-lifecycle.mjs .github/workflows/run-shared-evaluation-validator-migration-once.yml
          git commit -m "Align Shared Evaluation ownership validators"
          git push origin HEAD:arch/754-shared-evaluation-lifecycle
