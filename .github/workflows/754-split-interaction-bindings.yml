name: Split Shared interaction bindings

on:
  push:
    branches:
      - arch/754-shared-interaction-bindings

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-interaction-bindings
          fetch-depth: 0
      - name: Apply split
        run: python .github/scripts/754-split-interaction-bindings.py
      - name: Verify split
        run: |
          grep -q '^let pendingViewButtonPointer = null;' site/modules/core-sources/shared-interaction-bindings.js
          grep -q '^function setupChangelogSections() {' site/modules/core-sources/shared.js
          node --check site/modules/core-sources/shared-interaction-bindings.js
          node --check site/modules/core-sources/shared.js
      - name: Commit split
        run: |
          rm .github/scripts/754-split-interaction-bindings.py
          rm .github/workflows/754-split-interaction-bindings.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site .github/scripts/754-split-interaction-bindings.py .github/workflows/754-split-interaction-bindings.yml
          git commit -m "Split Shared interaction bindings"
          git push origin HEAD:arch/754-shared-interaction-bindings
