name: Split Shared foundations once

on:
  push:
    branches:
      - arch/754-shared-foundations-fragment

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/754-shared-foundations-fragment
          fetch-depth: 0

      - name: Split canonical Shared source without changing runtime bytes
        shell: python
        run: |
          from pathlib import Path

          shared_path = Path('site/modules/core-sources/shared.js')
          foundations_path = Path('site/modules/core-sources/shared-foundations.js')
          manifest_path = Path('site/modules/core-source-manifest.js')
          workflow_path = Path('.github/workflows/split-shared-foundations-once.yml')

          original = shared_path.read_text(encoding='utf-8').replace('\r\n', '\n').replace('\r', '\n')
          marker = '\n\nfunction normalizeSettingsTheme(value, fallback = "dark") {'
          if original.count(marker) != 1:
              raise SystemExit(f'Expected one Shared foundations boundary, found {original.count(marker)}')

          prefix, suffix_tail = original.split(marker, 1)
          foundations = prefix.rstrip()
          behavior = 'function normalizeSettingsTheme(value, fallback = "dark") {' + suffix_tail

          reconstructed = foundations + '\n\n' + behavior.rstrip()
          if reconstructed != original.rstrip():
              raise SystemExit('Shared source split is not byte-equivalent after canonical fragment concatenation')

          if not foundations.endswith('const openSelectedLinksButton = document.querySelector("#openSelectedLinksButton");'):
              raise SystemExit('Shared foundations did not end at the canonical DOM-binding boundary')
          if not behavior.startswith('function normalizeSettingsTheme(value, fallback = "dark") {'):
              raise SystemExit('Shared behavior did not begin at the canonical behavior boundary')

          foundations_path.write_text(foundations + '\n', encoding='utf-8')
          shared_path.write_text(behavior.rstrip() + '\n', encoding='utf-8')

          manifest = manifest_path.read_text(encoding='utf-8')
          old = '["shared", "shared.js", "app-core-runtime.js"'
          new = '["shared", ["shared-foundations.js", "shared.js"], "app-core-runtime.js"'
          if manifest.count(old) != 1:
              raise SystemExit(f'Expected one Shared manifest source entry, found {manifest.count(old)}')
          manifest_path.write_text(manifest.replace(old, new), encoding='utf-8')

          workflow_path.unlink()

      - name: Commit physical Shared source split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/core-sources/shared-foundations.js site/modules/core-sources/shared.js site/modules/core-source-manifest.js .github/workflows/split-shared-foundations-once.yml
          git commit -m "Split Shared foundations from behavior"
          git push origin HEAD:arch/754-shared-foundations-fragment
