name: Split Shared Home summary once

on:
  push:
    branches:
      - arch/754-shared-home-summary-fragment

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-home-summary-fragment
      - name: Split exact Home summary prefix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shared_path = Path("site/modules/core-sources/shared.js")
          home_path = Path("site/modules/core-sources/shared-home-summary.js")
          manifest_path = Path("site/modules/core-source-manifest.js")

          shared = shared_path.read_text(encoding="utf-8").replace("\r\n", "\n")
          home = home_path.read_text(encoding="utf-8").replace("\r\n", "\n").rstrip()
          marker = "function tablePageKey(pageName = state.currentPage) {"
          split_at = shared.index(marker)
          prefix = shared[:split_at].rstrip()
          remaining = shared[split_at:]
          if prefix != home:
              raise SystemExit("Home summary fragment does not exactly match the Shared prefix")
          if f"{home}\n\n{remaining}" != shared:
              raise SystemExit("Shared split would change assembled source bytes")

          shared_path.write_text(remaining, encoding="utf-8")

          manifest = manifest_path.read_text(encoding="utf-8")
          old = '["shared-foundations.js", "shared-session.js", "shared-routing.js", "shared-transitions.js", "shared-page-lifecycle.js", "shared.js"]'
          new = '["shared-foundations.js", "shared-session.js", "shared-routing.js", "shared-transitions.js", "shared-page-lifecycle.js", "shared-home-summary.js", "shared.js"]'
          if old not in manifest:
              raise SystemExit("Shared manifest anchor missing")
          manifest_path.write_text(manifest.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit permanent split and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/split-shared-home-summary-once.yml
          git add site/modules/core-source-manifest.js site/modules/core-sources/shared.js site/modules/core-sources/shared-home-summary.js
          git commit -m "Split Shared Home summary from table navigation state"
          git push origin HEAD:arch/754-shared-home-summary-fragment
