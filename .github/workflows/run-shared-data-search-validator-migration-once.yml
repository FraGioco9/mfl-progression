name: Run Shared data-search validator migration once

on:
  push:
    branches:
      - arch/754-shared-data-search-fragment
    paths:
      - .github/align-shared-data-search-validators-once.mjs
      - .github/workflows/run-shared-data-search-validator-migration-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-data-search-fragment
          fetch-depth: 0
      - name: Align Shared data/search validators
        run: node .github/align-shared-data-search-validators-once.mjs
      - name: Commit validator migration and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/validate.mjs site/validate-club-route-core.mjs site/validate-core-source-ownership.mjs
          git rm .github/align-shared-data-search-validators-once.mjs .github/workflows/run-shared-data-search-validator-migration-once.yml
          git commit -m "Align Shared data search validators"
          git push origin HEAD:arch/754-shared-data-search-fragment
