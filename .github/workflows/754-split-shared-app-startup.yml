name: Issue 754 split Shared app startup

on:
  push:
    branches:
      - arch/754-shared-app-startup

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-app-startup
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Split canonical Shared app startup
        run: |
          python .github/754-split-shared-app-startup.py
          node --check site/modules/core-sources/shared-app-startup.js
          node --check site/modules/core-sources/shared.js
          node --check site/modules/core-source-manifest.js
          node --check site/validate.mjs
          node --check site/validate-club-route-core.mjs
          node --check site/validate-core-source-ownership.mjs
          rm .github/754-split-shared-app-startup.py
          rm .github/workflows/754-split-shared-app-startup.yml
          git diff --check
      - name: Commit canonical split
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Split Shared application startup handoff"
          git push origin HEAD:arch/754-shared-app-startup
