name: Issue 754 canonical Shared validator readers

on:
  push:
    branches:
      - arch/754-canonical-shared-validator-readers

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-canonical-shared-validator-readers
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Migrate brittle Shared validator readers
        run: |
          python .github/754-canonical-shared-validator-readers.py
          for file in $(git diff --name-only -- 'site/validate*.mjs'); do node --check "$file"; done
          rm .github/754-canonical-shared-validator-readers.py
          rm .github/workflows/754-canonical-shared-validator-readers.yml
          git diff --check
      - name: Commit validator hygiene
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use canonical Shared source in validators"
          git push origin HEAD:arch/754-canonical-shared-validator-readers
