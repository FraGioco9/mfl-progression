name: Issue 754 Bootstrap canonical route state

on:
  push:
    branches:
      - arch/754-bootstrap-canonical-route-state

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-bootstrap-canonical-route-state
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Consolidate Bootstrap route state
        run: |
          python .github/754-canonicalize-bootstrap-route-state-v2.py
          node --check site/bootstrap.js
          node --check site/validate-app-config.mjs
          node --check site/validate-static-route-ui.mjs
          rm .github/754-canonicalize-bootstrap-route-state.py
          rm .github/754-canonicalize-bootstrap-route-state-v2.py
          rm .github/workflows/754-bootstrap-canonical-route-state.yml
          git diff --check
      - name: Commit Bootstrap route-state consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Canonicalize Bootstrap route state"
          git push origin HEAD:arch/754-bootstrap-canonical-route-state
