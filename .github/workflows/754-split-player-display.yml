name: Issue 754 Shared player display split

on:
  push:
    branches:
      - arch/754-shared-player-display

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-player-display
          fetch-depth: 0
      - name: Apply dependency-closed Shared split
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          shared_path = Path("site/modules/core-sources/shared.js")
          fragment_path = Path("site/modules/core-sources/shared-player-display.js")
          shared = shared_path.read_text()
          boundary = "async function copyPlayerId(id) {"
          boundary_index = shared.find(boundary)
          if boundary_index < 0:
              raise SystemExit("copyPlayerId boundary not found")
          expected_fragment = shared[:boundary_index].rstrip()
          actual_fragment = fragment_path.read_text().rstrip()
          if actual_fragment != expected_fragment:
              raise SystemExit("shared-player-display.js does not exactly match the canonical Shared prefix")
          shared_path.write_text(shared[boundary_index:])

          replace_once(
              "site/modules/core-source-manifest.js",
              '"shared-watchlist-actions.js", "shared.js"',
              '"shared-watchlist-actions.js", "shared-player-display.js", "shared.js"',
          )

          replace_once(
              "site/validate.mjs",
              "sharedCoreManifest?.sources?.length === 14",
              "sharedCoreManifest?.sources?.length === 15",
          )
          replace_once(
              "site/validate.mjs",
              '    && sharedCoreManifest.sources[13] === "shared.js"',
              '    && sharedCoreManifest.sources[13] === "shared-player-display.js"\n    && sharedCoreManifest.sources[14] === "shared.js"',
          )

          replace_once(
              "site/validate-club-route-core.mjs",
              "coreSourceByDomain.shared?.sources?.length === 14",
              "coreSourceByDomain.shared?.sources?.length === 15",
          )
          replace_once(
              "site/validate-club-route-core.mjs",
              '    && coreSourceByDomain.shared.sources[13] === "shared.js"',
              '    && coreSourceByDomain.shared.sources[13] === "shared-player-display.js"\n    && coreSourceByDomain.shared.sources[14] === "shared.js"',
          )

          ownership = "site/validate-core-source-ownership.mjs"
          replace_once(
              ownership,
              "sharedEntry?.sources?.length === 14",
              "sharedEntry?.sources?.length === 15",
          )
          replace_once(
              ownership,
              '    && sharedEntry.sources[13] === "shared.js"',
              '    && sharedEntry.sources[13] === "shared-player-display.js"\n    && sharedEntry.sources[14] === "shared.js"',
          )
          replace_once(
              ownership,
              "before Player first-paint/navigation before watchlist actions before remaining shared behavior",
              "before Player first-paint/navigation before watchlist actions before Player display/calculation before remaining shared behavior",
          )
          replace_once(
              ownership,
              'const sharedWatchlistActions = await read("./modules/core-sources/shared-watchlist-actions.js");\nconst sharedNavigation = await read("./modules/core-sources/shared.js");',
              'const sharedWatchlistActions = await read("./modules/core-sources/shared-watchlist-actions.js");\nconst sharedPlayerDisplay = await read("./modules/core-sources/shared-player-display.js");\nconst sharedNavigation = await read("./modules/core-sources/shared.js");',
          )
          replace_once(
              ownership,
              'invariant(\n  sharedNavigation.trimStart().startsWith("function countryCodeForNationality(nationality) {"),\n  "Remaining Shared behavior must begin at the Player display/calculation boundary.",\n);',
              'invariant(\n  sharedPlayerDisplay.trimStart().startsWith("function countryCodeForNationality(nationality) {")\n    && sharedPlayerDisplay.replace(/\\s*$/, "").endsWith(\'return "veryHard";\\n}\'),\n  "Shared Player display/calculation must own nationality, position, rating, progression-value, and Next Overall display helpers.",\n);\ninvariant(\n  sharedNavigation.startsWith("async function copyPlayerId(id) {"),\n  "Remaining Shared behavior must begin at the Player interaction boundary.",\n);',
          )
          replace_once(
              ownership,
              '    && !sharedPlayerFirstPaint.includes("function removePlayerIdFromAllWatchlists")\n    && !sharedWatchlistActions.includes("function countryCodeForNationality"),\n  "Shared foundations, session, routing, transitions, page lifecycle, Home summary, table state, generic toast core, personal state, data/search, Evaluation lifecycle, Player first-paint/navigation, and watchlist actions must not absorb later ownership domains.",',
              '    && !sharedPlayerFirstPaint.includes("function removePlayerIdFromAllWatchlists")\n    && !sharedWatchlistActions.includes("function countryCodeForNationality")\n    && !sharedPlayerDisplay.includes("async function copyPlayerId"),\n  "Shared foundations, session, routing, transitions, page lifecycle, Home summary, table state, generic toast core, personal state, data/search, Evaluation lifecycle, Player first-paint/navigation, watchlist actions, and Player display/calculation must not absorb later ownership domains.",',
          )
          PY
          rm .github/workflows/754-split-player-display.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Extract Shared player display helpers"
          git push origin HEAD:arch/754-shared-player-display
