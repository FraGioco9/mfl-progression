name: Align Shared page lifecycle validation once

on:
  push:
    branches:
      - arch/754-shared-page-lifecycle-fragment

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-page-lifecycle-fragment
      - name: Align TypeScript and ownership validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected anchor missing in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          p = Path("site/check-core-types.mjs")
          text = p.read_text(encoding="utf-8")
          old = '''  "modules/core-sources/shared-transitions.js:TS2339": 6,
  "modules/core-sources/shared.js:TS2304": 9,
  "modules/core-sources/shared.js:TS2339": 311,
  "modules/core-sources/shared.js:TS2345": 4,
  "modules/core-sources/shared.js:TS2551": 5,
  "modules/core-sources/shared.js:TS2552": 1,
'''
          new = '''  "modules/core-sources/shared-transitions.js:TS2339": 6,
  "modules/core-sources/shared-page-lifecycle.js:TS2304": 8,
  "modules/core-sources/shared-page-lifecycle.js:TS2339": 30,
  "modules/core-sources/shared-page-lifecycle.js:TS2552": 1,
  "modules/core-sources/shared.js:TS2304": 1,
  "modules/core-sources/shared.js:TS2339": 281,
  "modules/core-sources/shared.js:TS2345": 4,
  "modules/core-sources/shared.js:TS2551": 5,
'''
          if old not in text:
              raise SystemExit("TypeScript baseline relocation anchor missing")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "site/validate.mjs",
              '''    && sharedCoreManifest?.sources?.length === 5
    && sharedCoreManifest.sources[0] === "shared-foundations.js"
    && sharedCoreManifest.sources[1] === "shared-session.js"
    && sharedCoreManifest.sources[2] === "shared-routing.js"
    && sharedCoreManifest.sources[3] === "shared-transitions.js"
    && sharedCoreManifest.sources[4] === "shared.js"
''',
              '''    && sharedCoreManifest?.sources?.length === 6
    && sharedCoreManifest.sources[0] === "shared-foundations.js"
    && sharedCoreManifest.sources[1] === "shared-session.js"
    && sharedCoreManifest.sources[2] === "shared-routing.js"
    && sharedCoreManifest.sources[3] === "shared-transitions.js"
    && sharedCoreManifest.sources[4] === "shared-page-lifecycle.js"
    && sharedCoreManifest.sources[5] === "shared.js"
''',
          )

          replace(
              "site/validate-club-route-core.mjs",
              '''    && coreSourceByDomain.shared?.sources?.length === 5
    && coreSourceByDomain.shared.sources[1] === "shared-session.js"
    && coreSourceByDomain.shared.sources[2] === "shared-routing.js"
    && coreSourceByDomain.shared.sources[3] === "shared-transitions.js"
    && coreSourceByDomain.shared.sources[4] === "shared.js"
''',
              '''    && coreSourceByDomain.shared?.sources?.length === 6
    && coreSourceByDomain.shared.sources[1] === "shared-session.js"
    && coreSourceByDomain.shared.sources[2] === "shared-routing.js"
    && coreSourceByDomain.shared.sources[3] === "shared-transitions.js"
    && coreSourceByDomain.shared.sources[4] === "shared-page-lifecycle.js"
    && coreSourceByDomain.shared.sources[5] === "shared.js"
''',
          )

          p = Path("site/validate-core-source-ownership.mjs")
          text = p.read_text(encoding="utf-8")
          old = '''  sharedEntry?.source === "shared-foundations.js"
    && sharedEntry?.sources?.length === 5
    && sharedEntry.sources[0] === "shared-foundations.js"
    && sharedEntry.sources[1] === "shared-session.js"
    && sharedEntry.sources[2] === "shared-routing.js"
    && sharedEntry.sources[3] === "shared-transitions.js"
    && sharedEntry.sources[4] === "shared.js"
    && sharedEntry.maxUniversalBytes === 355000,
  "Shared core must keep foundations before session before routing before transitions before page lifecycle and retain the explicit 355000-byte universal no-growth ceiling.",
);
const sharedFoundations = await read("./modules/core-sources/shared-foundations.js");
const sharedSession = await read("./modules/core-sources/shared-session.js");
const sharedRouting = await read("./modules/core-sources/shared-routing.js");
const sharedTransitions = await read("./modules/core-sources/shared-transitions.js");
const sharedNavigation = await read("./modules/core-sources/shared.js");
'''
          new = '''  sharedEntry?.source === "shared-foundations.js"
    && sharedEntry?.sources?.length === 6
    && sharedEntry.sources[0] === "shared-foundations.js"
    && sharedEntry.sources[1] === "shared-session.js"
    && sharedEntry.sources[2] === "shared-routing.js"
    && sharedEntry.sources[3] === "shared-transitions.js"
    && sharedEntry.sources[4] === "shared-page-lifecycle.js"
    && sharedEntry.sources[5] === "shared.js"
    && sharedEntry.maxUniversalBytes === 355000,
  "Shared core must keep foundations before session before routing before transitions before page lifecycle before remaining shared behavior and retain the explicit 355000-byte universal no-growth ceiling.",
);
const sharedFoundations = await read("./modules/core-sources/shared-foundations.js");
const sharedSession = await read("./modules/core-sources/shared-session.js");
const sharedRouting = await read("./modules/core-sources/shared-routing.js");
const sharedTransitions = await read("./modules/core-sources/shared-transitions.js");
const sharedPageLifecycle = await read("./modules/core-sources/shared-page-lifecycle.js");
const sharedNavigation = await read("./modules/core-sources/shared.js");
'''
          if old not in text:
              raise SystemExit("Ownership manifest anchor missing")
          text = text.replace(old, new, 1)
          old = '''invariant(
  sharedNavigation.startsWith("function resetPageScroll() {"),
  "Shared page lifecycle must begin at the canonical reset-scroll boundary.",
);
invariant(
  !sharedFoundations.includes("function normalizeSettingsTheme")
    && !sharedSession.includes("function playerIdFromUrl")
    && !sharedRouting.includes("function currentNavigationPath")
    && !sharedTransitions.includes("function resetPageScroll"),
  "Shared foundations, session, routing, and transitions must not absorb later ownership domains.",
);
'''
          new = '''invariant(
  sharedPageLifecycle.startsWith("function resetPageScroll() {")
    && sharedPageLifecycle.replace(/\\s*$/, "").endsWith("syncHomeLoginButton();\\n}"),
  "Shared page lifecycle must own reset-scroll through the canonical setPage boundary.",
);
invariant(
  sharedNavigation.startsWith("function updateStatusDate(generatedAt) {"),
  "Remaining Shared behavior must begin at the canonical Home-summary boundary.",
);
invariant(
  !sharedFoundations.includes("function normalizeSettingsTheme")
    && !sharedSession.includes("function playerIdFromUrl")
    && !sharedRouting.includes("function currentNavigationPath")
    && !sharedTransitions.includes("function resetPageScroll")
    && !sharedPageLifecycle.includes("function updateStatusDate"),
  "Shared foundations, session, routing, transitions, and page lifecycle must not absorb later ownership domains.",
);
'''
          if old not in text:
              raise SystemExit("Ownership boundary anchor missing")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit validator migration and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/align-shared-page-lifecycle-validation-once.yml
          git add site/check-core-types.mjs site/validate.mjs site/validate-club-route-core.mjs site/validate-core-source-ownership.mjs
          git commit -m "Align validation with Shared page lifecycle fragment"
          git push origin HEAD:arch/754-shared-page-lifecycle-fragment
