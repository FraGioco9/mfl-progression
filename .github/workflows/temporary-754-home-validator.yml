name: Temporary 754 Home validator migration

on:
  push:
    branches:
      - perf/754-shared-data-client

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/754-shared-data-client
      - name: Move Home VM transport stub to canonical client
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("site/validate-home-summary-first-paint.mjs")
          source = target.read_text(encoding="utf-8")

          old_owner = "invariant(occurrences(eagerCore, 'fetch(\"/api/data?mode=bootstrap\"') === 1, \"The canonical shared core must keep exactly one database-summary fetch owner.\");"
          new_owner = "invariant(occurrences(eagerCore, 'window.__mflDataClient.fetch(\"/api/data?mode=bootstrap\"') === 1, \"The canonical shared core must keep exactly one database-summary data-client owner.\");"
          if source.count(old_owner) != 1:
              raise SystemExit("Home summary transport ownership assertion changed unexpectedly")
          source = source.replace(old_owner, new_owner)

          old_stub = '''const context = {
  fetch: async () => {
    fetchCount += 1;
    return {
      ok: true,
      json: async () => ({
        manifest: { version: "test" },
        summary: {
          playerCount: 321,
          walletCount: 87,
          generatedAt: "2026-08-21T12:00:00.000Z",
        },
      }),
    };
  },
  state: {},'''
          new_stub = '''const context = {
  window: {
    __mflDataClient: {
      fetch: async () => {
        fetchCount += 1;
        return {
          ok: true,
          json: async () => ({
            manifest: { version: "test" },
            summary: {
              playerCount: 321,
              walletCount: 87,
              generatedAt: "2026-08-21T12:00:00.000Z",
            },
          }),
        };
      },
    },
  },
  state: {},'''
          if source.count(old_stub) != 1:
              raise SystemExit("Home summary VM transport stub changed unexpectedly")
          source = source.replace(old_stub, new_stub)
          target.write_text(source, encoding="utf-8")

          Path(".github/workflows/temporary-754-home-validator.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/validate-home-summary-first-paint.mjs .github/workflows/temporary-754-home-validator.yml
          git commit -m "Validate Home summary data-client transport"
          git push origin HEAD:perf/754-shared-data-client
