name: Run Shared Player first-paint validator migration once

on:
  push:
    branches:
      - arch/754-shared-player-first-paint

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Align Shared Player first-paint ownership validators
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          validate = Path("site/validate.mjs")
          replace_once(validate, "sharedCoreManifest?.sources?.length === 12", "sharedCoreManifest?.sources?.length === 13")
          replace_once(
              validate,
              '    && sharedCoreManifest.sources[10] === "shared-evaluation-lifecycle.js"\n    && sharedCoreManifest.sources[11] === "shared.js"',
              '    && sharedCoreManifest.sources[10] === "shared-evaluation-lifecycle.js"\n    && sharedCoreManifest.sources[11] === "shared-player-first-paint.js"\n    && sharedCoreManifest.sources[12] === "shared.js"',
          )

          club = Path("site/validate-club-route-core.mjs")
          replace_once(club, "coreSourceByDomain.shared?.sources?.length === 12", "coreSourceByDomain.shared?.sources?.length === 13")
          replace_once(
              club,
              '    && coreSourceByDomain.shared.sources[10] === "shared-evaluation-lifecycle.js"\n    && coreSourceByDomain.shared.sources[11] === "shared.js"',
              '    && coreSourceByDomain.shared.sources[10] === "shared-evaluation-lifecycle.js"\n    && coreSourceByDomain.shared.sources[11] === "shared-player-first-paint.js"\n    && coreSourceByDomain.shared.sources[12] === "shared.js"',
          )

          ownership = Path("site/validate-core-source-ownership.mjs")
          replace_once(ownership, "sharedEntry?.sources?.length === 12", "sharedEntry?.sources?.length === 13")
          replace_once(
              ownership,
              '    && sharedEntry.sources[10] === "shared-evaluation-lifecycle.js"\n    && sharedEntry.sources[11] === "shared.js"',
              '    && sharedEntry.sources[10] === "shared-evaluation-lifecycle.js"\n    && sharedEntry.sources[11] === "shared-player-first-paint.js"\n    && sharedEntry.sources[12] === "shared.js"',
          )
          replace_once(
              ownership,
              '  "Shared core must keep foundations before session before routing before transitions before page lifecycle before Home summary before table state before generic toast core before personal state before data/search before Evaluation lifecycle before remaining shared behavior and retain the explicit 355000-byte universal no-growth ceiling.",',
              '  "Shared core must keep foundations before session before routing before transitions before page lifecycle before Home summary before table state before generic toast core before personal state before data/search before Evaluation lifecycle before Player first-paint/navigation before remaining shared behavior and retain the explicit 355000-byte universal no-growth ceiling.",',
          )
          replace_once(
              ownership,
              'const sharedEvaluationLifecycle = await read("./modules/core-sources/shared-evaluation-lifecycle.js");\nconst sharedNavigation = await read("./modules/core-sources/shared.js");',
              'const sharedEvaluationLifecycle = await read("./modules/core-sources/shared-evaluation-lifecycle.js");\nconst sharedPlayerFirstPaint = await read("./modules/core-sources/shared-player-first-paint.js");\nconst sharedNavigation = await read("./modules/core-sources/shared.js");',
          )
          replace_once(
              ownership,
              'invariant(\n  sharedNavigation.startsWith("function playerFirstPaintKnownValues(row) {"),\n  "Remaining Shared behavior must begin at the Player first-paint/navigation boundary.",\n);',
              'invariant(\n  sharedPlayerFirstPaint.startsWith("function playerFirstPaintKnownValues(row) {")\n    && sharedPlayerFirstPaint.replace(/\\s*$/, "").endsWith(\'setPage("player", true, { playerId: key, __mflPlayerFirstPaintContext: pendingContext });\\n}\'),\n  "Shared Player first-paint/navigation must own cached context construction through the canonical openPlayerPage facade.",\n);\ninvariant(\n  sharedNavigation.startsWith("function removePlayerIdFromAllWatchlists(playerId) {"),\n  "Remaining Shared behavior must begin at the watchlist mutation boundary.",\n);',
          )
          replace_once(
              ownership,
              '    && !sharedDataSearch.includes("const DEFAULT_EVALUATION_MFL_PER_USD")\n    && !sharedEvaluationLifecycle.includes("function playerFirstPaintKnownValues"),\n  "Shared foundations, session, routing, transitions, page lifecycle, Home summary, table state, generic toast core, personal state, data/search, and Evaluation lifecycle must not absorb later ownership domains.",',
              '    && !sharedDataSearch.includes("const DEFAULT_EVALUATION_MFL_PER_USD")\n    && !sharedEvaluationLifecycle.includes("function playerFirstPaintKnownValues")\n    && !sharedPlayerFirstPaint.includes("function removePlayerIdFromAllWatchlists"),\n  "Shared foundations, session, routing, transitions, page lifecycle, Home summary, table state, generic toast core, personal state, data/search, Evaluation lifecycle, and Player first-paint/navigation must not absorb later ownership domains.",',
          )

          docs = Path("docs/ownership.md")
          text = docs.read_text(encoding="utf-8")
          old = '`site/modules/core-sources/shared-evaluation-lifecycle.js` owns eager Evaluation settings, search-selection, readiness, and render facades from `DEFAULT_EVALUATION_MFL_PER_USD` through `renderEvaluationPage()`; `site/modules/core-sources/shared.js` now begins at `playerFirstPaintKnownValues()` and owns the remaining Player/navigation and later shared behavior.'
          new = '`site/modules/core-sources/shared-evaluation-lifecycle.js` owns eager Evaluation settings, search-selection, readiness, and render facades from `DEFAULT_EVALUATION_MFL_PER_USD` through `renderEvaluationPage()`; `site/modules/core-sources/shared-player-first-paint.js` owns Player cached first-paint context construction and navigation from `playerFirstPaintKnownValues()` through `openPlayerPage()`; `site/modules/core-sources/shared.js` now begins at `removePlayerIdFromAllWatchlists()` and owns the remaining watchlist mutation and later shared behavior.'
          if text.count(old) != 1:
              raise SystemExit("docs/ownership.md: Player first-paint ownership sentence not found exactly once")
          text = text.replace(old, new, 1)
          text = text.replace(
              'and Evaluation lifecycle remains separate from Player/navigation behavior so bootstrap data loading, navigation/session state, feature feedback, persistence, shared row/search modeling, Evaluation readiness, and Player first-paint ownership keep explicit boundaries.',
              'Evaluation lifecycle remains separate from Player first-paint/navigation, and Player first-paint/navigation remains separate from watchlist mutation behavior so bootstrap data loading, navigation/session state, feature feedback, persistence, shared row/search modeling, Evaluation readiness, Player first paint, and watchlist mutations keep explicit boundaries.',
              1,
          )
          text = text.replace(
              'The eager Evaluation lifecycle is isolated without reordering source, preserving byte-identical execution while exposing Player first-paint/navigation as the next remaining Shared boundary.',
              'The eager Evaluation lifecycle and Player first-paint/navigation are isolated without reordering source, preserving byte-identical execution while exposing watchlist mutation as the next remaining Shared boundary.',
              1,
          )
          text = text.replace(
              'Evaluation settings/search/readiness assertions must not read final `shared.js` directly for behavior owned by `shared-evaluation-lifecycle.js`.',
              'Evaluation settings/search/readiness assertions must not read final `shared.js` directly for behavior owned by `shared-evaluation-lifecycle.js`; Player cached first-paint/navigation assertions must not read final `shared.js` directly for behavior owned by `shared-player-first-paint.js`.',
              1,
          )
          docs.write_text(text, encoding="utf-8")
          PY
      - name: Commit validator migration and remove one-time files
        shell: bash
        run: |
          rm .github/workflows/run-shared-player-first-paint-validator-migration-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ownership.md site/validate.mjs site/validate-club-route-core.mjs site/validate-core-source-ownership.mjs .github/workflows/run-shared-player-first-paint-validator-migration-once.yml
          git commit -m "Align Shared Player first-paint ownership validators"
          git push origin HEAD:arch/754-shared-player-first-paint
