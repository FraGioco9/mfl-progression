name: Apply My Clubs title and logo refinement

on:
  push:
    branches: [feat/205-my-clubs-data]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/205-my-clubs-data
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Apply canonical source refinement
        working-directory: site
        run: python apply-my-clubs-title-logo.py
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build canonical site assets
        working-directory: site
        run: npm run build
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Typecheck
        working-directory: site
        run: npm run typecheck
      - name: Repository validation
        working-directory: site
        run: npm run validate
      - name: Commit refined My Clubs sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f site/apply-my-clubs-title-logo.py
          git rm .github/workflows/apply-my-clubs-title-logo.yml
          git add -A
          git commit -m "Prime Club titles from My Clubs cards"
          git push origin HEAD:feat/205-my-clubs-data
