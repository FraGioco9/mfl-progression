name: Apply club location data migration

on:
  push:
    branches: [feat/757-club-location-data]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/757-club-location-data
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply canonical migration
        run: python scripts/database/apply_club_location_migration.py
      - name: Run focused database tests
        run: python -m unittest tests.test_club_leaderboard
      - name: Validate database builder syntax
        run: python -m py_compile scripts/database/clubs.py scripts/database/prepare_runtime_database.py
      - name: Commit canonical migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/database/apply_club_location_migration.py .github/workflows/apply-club-location-migration.yml
          git add scripts/database/clubs.py scripts/database/prepare_runtime_database.py tests/test_club_leaderboard.py
          git commit -m "Persist club city and country in runtime data"
          git push origin HEAD:feat/757-club-location-data
