name: Issue 754 Table render lifecycle

on:
  push:
    branches:
      - arch/754-table-render-lifecycle

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-table-render-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Split Table render lifecycle
        run: |
          python .github/754-split-table-render-lifecycle.py
          node --check site/modules/core-sources/table.js
          node --check site/modules/core-sources/table-render-lifecycle.js
          node --check site/modules/core-sources/table-interaction-bindings.js
          node --check site/modules/core-source-manifest.js
          for file in $(git diff --name-only -- 'site/validate*.mjs'); do node --check "$file"; done
          rm .github/754-split-table-render-lifecycle.py
          rm .github/workflows/754-table-render-lifecycle.yml
          git diff --check
      - name: Commit Table render decomposition
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Split Table render lifecycle"
          git push origin HEAD:arch/754-table-render-lifecycle
