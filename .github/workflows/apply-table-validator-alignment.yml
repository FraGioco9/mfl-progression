name: Apply table validator alignment

on:
  push:
    branches:
      - refactor/739-shared-table-foundations

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refactor/739-shared-table-foundations

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Align canonical validators
        run: node site/apply-table-validator-alignment.mjs

      - name: Commit validator alignment
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No validator changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align table foundation validation"
          git push origin "HEAD:refactor/739-shared-table-foundations"
