name: Run table-state validator migration once

on:
  push:
    branches:
      - arch/754-shared-table-state-fragment

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-table-state-fragment
      - run: node .github/align-table-state-validation.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/align-table-state-validation.mjs .github/workflows/run-table-state-validator-migration-once.yml
          git add site/validate.mjs site/validate-club-route-core.mjs site/validate-core-source-ownership.mjs
          git commit -m "Align validation with Shared table state fragment"
          git push origin HEAD:arch/754-shared-table-state-fragment
