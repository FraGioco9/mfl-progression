name: Run Shared Player first-paint split once

on:
  push:
    branches:
      - arch/754-shared-player-first-paint

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Split Shared Player first-paint navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shared_path = Path("site/modules/core-sources/shared.js")
          fragment_path = Path("site/modules/core-sources/shared-player-first-paint.js")
          manifest_path = Path("site/modules/core-source-manifest.js")

          source = shared_path.read_text(encoding="utf-8")
          marker = "function removePlayerIdFromAllWatchlists(playerId) {"
          if source.count(marker) != 1:
              raise SystemExit(f"Expected exactly one split marker, found {source.count(marker)}")
          split_at = source.index(marker)
          fragment = source[:split_at].rstrip()
          remainder = source[split_at:]

          if not fragment.startswith("function playerFirstPaintKnownValues(row) {"):
              raise SystemExit("Player first-paint fragment does not start at canonical boundary")
          if not fragment.endswith('setPage("player", true, { playerId: key, __mflPlayerFirstPaintContext: pendingContext });\n}'):
              raise SystemExit("Player first-paint fragment does not end at canonical openPlayerPage facade")
          if not remainder.startswith(marker):
              raise SystemExit("Remaining Shared fragment does not start at watchlist mutation boundary")
          if fragment + "\n\n" + remainder.rstrip() != source.rstrip():
              raise SystemExit("Split would change assembled Shared source bytes")

          fragment_path.write_text(fragment + "\n", encoding="utf-8")
          shared_path.write_text(remainder, encoding="utf-8")

          manifest = manifest_path.read_text(encoding="utf-8")
          old = '"shared-evaluation-lifecycle.js", "shared.js"'
          new = '"shared-evaluation-lifecycle.js", "shared-player-first-paint.js", "shared.js"'
          if manifest.count(old) != 1:
              raise SystemExit(f"Expected one manifest insertion point, found {manifest.count(old)}")
          manifest_path.write_text(manifest.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit split and remove one-time migration
        shell: bash
        run: |
          rm .github/workflows/run-shared-player-first-paint-split-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/core-source-manifest.js site/modules/core-sources/shared-player-first-paint.js site/modules/core-sources/shared.js .github/workflows/run-shared-player-first-paint-split-once.yml
          git commit -m "Split Shared Player first-paint fragment"
          git push origin HEAD:arch/754-shared-player-first-paint
