name: Run Shared personal-state split once

on:
  push:
    branches:
      - arch/754-shared-personal-state-fragment

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-personal-state-fragment
      - name: Split Shared personal state
        run: node .github/split-shared-personal-state.mjs
      - name: Commit split and remove one-time migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/split-shared-personal-state.mjs .github/workflows/run-shared-personal-state-split-once.yml
          git add site/modules/core-source-manifest.js site/modules/core-sources/shared-personal-state.js site/modules/core-sources/shared.js
          git commit -m "Split Shared personal state"
          git push origin HEAD:arch/754-shared-personal-state-fragment
