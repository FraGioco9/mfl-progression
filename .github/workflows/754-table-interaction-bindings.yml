name: Issue 754 Table interaction bindings

on:
  push:
    branches:
      - arch/754-table-interaction-bindings

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-table-interaction-bindings
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Split Table interaction bindings
        run: |
          python .github/754-split-table-interaction-bindings.py
          node --check site/modules/core-sources/table.js
          node --check site/modules/core-sources/table-interaction-bindings.js
          node --check site/modules/core-source-manifest.js
          node --check site/validate.mjs
          node --check site/validate-table-route-core.mjs
          node --check site/validate-club-route-core.mjs
          node --check site/validate-table-filter-selection-lifecycle.mjs
          node --check site/validate-mobile-table-retry.mjs
          node --check site/validate-mobile-table-compact-contract.mjs
          rm .github/754-split-table-interaction-bindings.py
          rm .github/workflows/754-table-interaction-bindings.yml
          git diff --check
      - name: Commit Table source decomposition
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Split Table interaction bindings"
          git push origin HEAD:arch/754-table-interaction-bindings
