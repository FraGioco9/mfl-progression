name: Issue 754 retire Shared tail

on:
  push:
    branches:
      - arch/754-retire-shared-tail

permissions:
  contents: write

jobs:
  retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-retire-shared-tail
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Retire legacy Shared tail filename
        run: |
          python .github/754-retire-shared-tail.py
          node --check site/modules/core-sources/shared-shell-navigation.js
          node --check site/modules/core-source-manifest.js
          node --check site/check-core-types.mjs
          node --check site/validate.mjs
          node --check site/validate-club-route-core.mjs
          node --check site/validate-core-source-ownership.mjs
          node --check site/validate-progression-sorting.mjs
          node --check site/validate-evaluation-saved-share-icon.mjs
          node --check site/validate-stats-mobile-scaling.mjs
          node --check site/validate-z-index-ownership.mjs
          rm .github/754-retire-shared-tail.py
          rm .github/workflows/754-retire-shared-tail.yml
          rm .github/workflows/754-scan-shared-tail-refs.yml
          git diff --check
          if git grep -n -F 'shared.js' -- ':!site/modules/app-core-runtime.js'; then
            echo 'Unexpected legacy shared.js reference remains before generated artifact refresh.' >&2
            exit 1
          fi
      - name: Commit final Shared ownership
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Retire legacy Shared tail"
          git push origin HEAD:arch/754-retire-shared-tail
