name: Fix startup validator lookups

on:
  push:
    branches:
      - arch/754-shared-startup-lifecycle

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-startup-lifecycle
          fetch-depth: 0
      - name: Apply validator lookup fix
        run: python .github/scripts/754-fix-startup-validator-lookups.py
      - name: Verify validators parse
        run: |
          node --check site/validate-generated-core-bindings.mjs
          node --check site/validate-supabase-persistence.mjs
          node --check site/validate-app-core-startup-handshake.mjs
      - name: Commit validator lookup fix
        run: |
          rm .github/scripts/754-fix-startup-validator-lookups.py
          rm .github/workflows/754-fix-startup-validator-lookups.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site .github/scripts/754-fix-startup-validator-lookups.py .github/workflows/754-fix-startup-validator-lookups.yml
          git commit -m "Fix startup validator source lookups"
          git push origin HEAD:arch/754-shared-startup-lifecycle
