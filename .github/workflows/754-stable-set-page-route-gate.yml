name: Issue 754 stable setPage route gate

on:
  push:
    branches:
      - refactor/754-stable-set-page-route-gate

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/754-stable-set-page-route-gate
          fetch-depth: 0
      - name: Canonicalize stable setPage ownership
        run: python .github/scripts/754-stable-set-page-route-gate.py
      - name: Verify source and validator syntax
        run: |
          node --check site/modules/core-sources/shared-page-lifecycle.js
          node --check site/modules/core-sources/shared-route-runtime-gate.js
          node --check site/modules/core-sources/shared.js
          node --check site/watchlist-myplayers-route-runtime.js
          node --check site/validate.mjs
          node --check site/validate-club-route-core.mjs
          node --check site/validate-core-source-ownership.mjs
          node --check site/validate-page-route-gate-transition.mjs
          node --check site/validate-active-filter-control.mjs
          node --check site/validate-watchlist-route-core.mjs
          node --check site/validate-eval-ownership.mjs
      - name: Commit stable ownership
        run: |
          rm .github/scripts/754-stable-set-page-route-gate.py
          rm .github/workflows/754-stable-set-page-route-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Canonicalize stable setPage route ownership"
          git push origin HEAD:refactor/754-stable-set-page-route-gate
