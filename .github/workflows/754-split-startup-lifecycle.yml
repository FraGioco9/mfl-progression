name: Split Shared startup lifecycle

on:
  push:
    branches:
      - arch/754-shared-startup-lifecycle

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-startup-lifecycle
          fetch-depth: 0
      - name: Apply split
        run: python .github/scripts/754-split-startup-lifecycle.py
      - name: Verify split
        run: |
          grep -q '^function setupChangelogSections() {' site/modules/core-sources/shared-startup-lifecycle.js
          grep -q '^;(() => {' site/modules/core-sources/shared.js
          node --check site/modules/core-sources/shared-startup-lifecycle.js
          node --check site/modules/core-sources/shared.js
      - name: Commit split
        run: |
          rm .github/scripts/754-split-startup-lifecycle.py
          rm .github/workflows/754-split-startup-lifecycle.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site .github/scripts/754-split-startup-lifecycle.py .github/workflows/754-split-startup-lifecycle.yml
          git commit -m "Split Shared startup lifecycle"
          git push origin HEAD:arch/754-shared-startup-lifecycle
