name: Player fetch toggle migration
on:
  push:
    branches:
      - issue-862-player-fetch-toggle
    paths:
      - .github/workflows/player-toggle-migration.yml
jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-862-player-fetch-toggle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply player toggle changes
        run: python .github/player-toggle-migration.py
      - name: Run focused tests
        run: python -m unittest tests.test_rebuild_database_runner_options tests.test_full_database_refresh_workflow
      - name: Commit permanent changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/database/rebuild_database.py scripts/database/rebuild_database_runner.py .github/workflows/full-database-refresh.yml tests/test_rebuild_database_runner_options.py tests/test_full_database_refresh_workflow.py
          git rm .github/player-toggle-migration.py .github/workflows/player-toggle-migration.yml
          git commit -m 'Add player fetch toggle'
          git push
