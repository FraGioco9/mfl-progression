name: Run Shared toast-core split once

on:
  push:
    branches:
      - arch/754-shared-toast-core-fragment

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-toast-core-fragment
      - name: Split generic toast core
        run: node .github/split-shared-toast-core.mjs
      - name: Commit split and remove one-time migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/split-shared-toast-core.mjs .github/workflows/run-shared-toast-core-split-once.yml
          git add site/modules/core-source-manifest.js site/modules/core-sources/shared-toast-core.js site/modules/core-sources/shared.js
          git commit -m "Split Shared generic toast core"
          git push origin HEAD:arch/754-shared-toast-core-fragment
