name: Issue 754 finish Bootstrap route state

on:
  push:
    branches:
      - arch/754-bootstrap-canonical-route-state

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-bootstrap-canonical-route-state
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Finish Bootstrap route-state cleanup
        run: |
          python .github/754-finish-bootstrap-route-state.py
          node --check site/bootstrap.js
          rm .github/754-finish-bootstrap-route-state.py
          rm .github/workflows/754-finish-bootstrap-route-state.yml
          git diff --check
      - name: Commit remaining Bootstrap route-state cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Bootstrap route-state consolidation"
          git push origin HEAD:arch/754-bootstrap-canonical-route-state
