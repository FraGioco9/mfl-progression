name: Split Shared wallet row classification

on:
  push:
    branches:
      - arch/754-shared-wallet-row-classification

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-shared-wallet-row-classification
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Extract dependency-closed prefix
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('site')
          shared_path = root / 'modules/core-sources/shared.js'
          source = shared_path.read_text(encoding='utf-8').replace('\r\n', '\n').replace('\r', '\n')
          start = 'function linkedWalletAddressesForOwnedPlayers() {'
          boundary = '\nfunction escapeHtml(value) {'
          assert source.startswith(start), 'Shared head moved before wallet-row extraction.'
          cut = source.index(boundary)
          fragment = source[:cut].rstrip() + '\n'
          remainder = source[cut + 1:]
          assert fragment.startswith(start)
          assert 'function rowIsMflWalletPlayer(row) {' in fragment
          assert 'function rowHasHiddenMflJoinedAgencyDate(row) {' in fragment
          assert fragment.rstrip().endswith('return joinedDay !== null && [parseFilterDateDay("2025-10-09"), parseFilterDateDay("2025-10-10")].includes(joinedDay);\n}')
          assert remainder.startswith('function escapeHtml(value) {')
          (root / 'modules/core-sources/shared-wallet-row-classification.js').write_text(fragment, encoding='utf-8')
          shared_path.write_text(remainder, encoding='utf-8')

          manifest_path = root / 'modules/core-source-manifest.js'
          manifest = manifest_path.read_text(encoding='utf-8')
          old = '"shared-modal-lifecycle.js", "shared-global-search.js", "shared.js"'
          new = '"shared-modal-lifecycle.js", "shared-global-search.js", "shared-wallet-row-classification.js", "shared.js"'
          assert manifest.count(old) == 1
          manifest_path.write_text(manifest.replace(old, new), encoding='utf-8')

          ownership_path = root / 'validate-core-source-ownership.mjs'
          ownership = ownership_path.read_text(encoding='utf-8')
          replacements = [
              ('sharedEntry?.sources?.length === 18', 'sharedEntry?.sources?.length === 19'),
              ('&& sharedEntry.sources[17] === "shared.js"', '&& sharedEntry.sources[17] === "shared-wallet-row-classification.js"\n    && sharedEntry.sources[18] === "shared.js"'),
              ('before Global Search lifecycle before remaining shared behavior', 'before Global Search lifecycle before linked-wallet/MFL row classification before remaining shared behavior'),
              ('const sharedGlobalSearch = await read("./modules/core-sources/shared-global-search.js");\nconst sharedNavigation = await read("./modules/core-sources/shared.js");', 'const sharedGlobalSearch = await read("./modules/core-sources/shared-global-search.js");\nconst sharedWalletRowClassification = await read("./modules/core-sources/shared-wallet-row-classification.js");\nconst sharedRemaining = await read("./modules/core-sources/shared.js");'),
              ('invariant(\n  sharedNavigation.startsWith("function linkedWalletAddressesForOwnedPlayers() {"),\n  "Remaining Shared behavior must begin at the linked-wallet/MFL data-helper boundary.",\n);', 'invariant(\n  sharedWalletRowClassification.startsWith("function linkedWalletAddressesForOwnedPlayers() {")\n    && sharedWalletRowClassification.replace(/\\s*$/, "").endsWith(\'return joinedDay !== null && [parseFilterDateDay("2025-10-09"), parseFilterDateDay("2025-10-10")].includes(joinedDay);\\n}\'),\n  "Shared wallet-row classification must own linked-wallet ownership, MFL wallet detection, and the hidden Joined Agency-date rule.",\n);\ninvariant(\n  sharedRemaining.startsWith("function escapeHtml(value) {"),\n  "Remaining Shared behavior must begin at the universal escaping/serialization boundary.",\n);'),
              ('&& !sharedGlobalSearch.includes("function linkedWalletAddressesForOwnedPlayers"),', '&& !sharedGlobalSearch.includes("function linkedWalletAddressesForOwnedPlayers")\n    && !sharedWalletRowClassification.includes("function escapeHtml"),'),
              ('generic modal lifecycle, and Global Search lifecycle must not absorb later ownership domains.', 'generic modal lifecycle, Global Search lifecycle, and wallet-row classification must not absorb later ownership domains.'),
          ]
          for old, new in replacements:
              assert ownership.count(old) == 1, f'ownership replacement missing: {old}'
              ownership = ownership.replace(old, new)
          ownership_path.write_text(ownership, encoding='utf-8')

          for relative in ['validate.mjs', 'validate-club-route-core.mjs']:
              path = root / relative
              text = path.read_text(encoding='utf-8')
              count_old = 'sources?.length === 18'
              assert text.count(count_old) == 1, f'{relative}: shared count anchor moved'
              text = text.replace(count_old, 'sources?.length === 19')
              if relative == 'validate.mjs':
                  old_tail = '&& sharedCoreManifest.sources[17] === "shared.js"'
                  new_tail = '&& sharedCoreManifest.sources[17] === "shared-wallet-row-classification.js"\n    && sharedCoreManifest.sources[18] === "shared.js"'
              else:
                  old_tail = '&& coreSourceByDomain.shared.sources[17] === "shared.js"'
                  new_tail = '&& coreSourceByDomain.shared.sources[17] === "shared-wallet-row-classification.js"\n    && coreSourceByDomain.shared.sources[18] === "shared.js"'
              assert text.count(old_tail) == 1, f'{relative}: shared tail anchor moved'
              path.write_text(text.replace(old_tail, new_tail), encoding='utf-8')
          PY
      - name: Verify exact extraction
        run: |
          test ! -e .github/workflows/754-split-wallet-row-classification.done
          grep -q '^function linkedWalletAddressesForOwnedPlayers() {' site/modules/core-sources/shared-wallet-row-classification.js
          grep -q '^function escapeHtml(value) {' site/modules/core-sources/shared.js
          node --check site/modules/core-sources/shared-wallet-row-classification.js
          node --check site/modules/core-sources/shared.js
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/754-split-wallet-row-classification.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site .github/workflows/754-split-wallet-row-classification.yml
          git commit -m "Split Shared wallet row classification"
          git push origin HEAD:arch/754-shared-wallet-row-classification
