name: Issue 754 scan Shared tail references

on:
  push:
    branches:
      - arch/754-retire-shared-tail

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arch/754-retire-shared-tail
      - name: List residual physical Shared references
        run: |
          git grep -n -F 'modules/core-sources/shared.js' -- ':!site/modules/app-core-runtime.js' || true
          echo '--- shared.js references without modules/core-sources prefix ---'
          git grep -n -F 'shared.js' -- site docs ':!site/modules/app-core-runtime.js' || true
